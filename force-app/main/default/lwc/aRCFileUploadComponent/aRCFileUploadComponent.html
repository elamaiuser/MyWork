<template>
    <lightning-card>
        <div id="parentdiv" style="padding: 10px;">
            <div style="display: grid;">
                <div style="display: inline-flex;">
                    <div style="padding: 5px;padding-top: 8px;">
                        <template if:true={typeoptions}>
                            <lightning-combobox
                            name="availabletypes"
                            label="Available Types"
                            value={value}
                            placeholder="Available Types"
                            options={typeoptions}
                            onchange={handleChange}
                            required=true
                            disabled={disableTypeselection}>
                            </lightning-combobox>
                            <template for:each={showFileNames} for:item="fileName">
                                <div key={fileName} style="max-width: 250px;">
                                    <span style="color:red;">{fileName}</span>
                                </div> 
                            </template>                          
                        </template>



                <!-- Action Buttons  Section -->
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-grid slds-grid_vertical-align-center slds-p-top_large">
                        <div class="slds-p-horizontal_x-small">
                            <lightning-button-icon 
                                icon-name="utility:add"
                                variant="brand"
                                size="medium"
                                alternative-text="add" 
                                title="Add Row"
                                onclick={addRows}
                                disabled={displayAddIcon}>
                            </lightning-button-icon>
                        </div>
                        

                        <lightning-file-upload
                        label="Upload files"
                        name="fileUploader"
                        accept={acceptedFormats}
                        record-id={recordId}
                        onuploadfinished={handleUploadFinished}
                        disabled={disableUploadFile}
                        multiple>
                        </lightning-file-upload>


                    </div>

                    <div style="padding: 5px;">
                        <div class="lgc-bg" style="padding-top: 25px;">                            
                                <lightning-button-icon icon-name="utility:add"  
                                alternative-text="add" 
                                title="add" onclick={addRows}
                                disabled={displayAddIcon}></lightning-button-icon>                          
                                       
                        </div>
                    </div>

                    <div style="padding: 5px;">
                        <div class="lgc-bg" style="padding-top: 25px;" >
                            
                            <template if:true={displayDeleteIcon}>
                                    <lightning-button-icon 
                                    icon-name="utility:delete"  alternative-text="delete" 
                                    title="delete" onclick={deleteRows}></lightning-button-icon> 
                            </template>           
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        

        
    </lightning-card>
</template>
