<template>
    <lightning-spinner if:true={showSpinner} class="spins" size="medium"></lightning-spinner>

    <div if:true={showBadgeLogo} class="slds-grid slds-wrap slds-align_absolute-center">
        <template for:each={specialCircumstancesFieldValuesWithBadges} for:item="item">
            <div key={item.value} class="custom-badge-style">
                <img src={item.badgeLogo} alt={item.label}>
            </div>
        </template>
    </div>
</template>
