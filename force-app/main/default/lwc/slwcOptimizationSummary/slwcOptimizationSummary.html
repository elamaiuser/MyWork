<template>
  <div class="optimization-summary-page">
    <lightning-spinner if:true={showSpinner} class="spins" size="medium"></lightning-spinner>

    <div class="slds-grid">
      <div class="slds-col width-100 slds-scrollable_y">
        <div class="slds-grid slds-grid_vertical-align-end">
          <div class="slds-col slds-grid slds-grid_vertical-align-center">
            <lightning-button icon-name="utility:chevronleft" onclick={handleClose} label="Back"></lightning-button>
            <h2 class="slds-nav-vertical__title slds-m-left_small" style="padding: 0 0.25rem;">
              {optimizationRun.name}
            </h2>
          </div>
          <div class="slds-col_bump-left">
            <lightning-button label="Dispatch All" variant="brand" onclick={showDispatchDriveModal} disabled={btnDispatchDisabled}></lightning-button>
          </div>
        </div>
        <div class="slds-grow">
          <template for:each={optimizationQueues} for:item="optimizationQueue">
            <c-slwc-optimization-queue-summary key={optimizationQueue.id} optimization-queue={optimizationQueue} onroleclick={handleRoleClick}></c-slwc-optimization-queue-summary>
          </template>
        </div>
      </div>
    </div>

    <c-slwc-dispatch-drive-modal
        drives={dispatchDriveModalData.drives}
        is-open={dispatchDriveModalData.isOpen}
        onclose={hideDispatchDriveModal}
    ></c-slwc-dispatch-drive-modal>
    <c-slwc-drive-staffing-details
      scheduling-console-territory-keys={schedulingConsoleTerritoryKeys}
      is-open={driveSideMenuData.shown}
      record-id={driveSideMenuData.recordId}
      job-id={driveSideMenuData.jobId}
      onclose={closeDriveSideMenu}
      onsave={saveDriveSideMenu}
    ></c-slwc-drive-staffing-details>
  </div>
</template>
