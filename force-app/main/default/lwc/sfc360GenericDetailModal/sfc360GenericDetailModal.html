<template>
<template if:true={open}>
    <section role="dialog" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">

            <header class="slds-modal__header">
                <h2 class="slds-modal__title">{title}</h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium slds-scrollable_y"
                 style="max-height: 400px;">

                <template if:true={loading}>
                    <div class="slds-is-relative" style="min-height:150px">
                        <lightning-spinner size="medium"></lightning-spinner>
                    </div>
                </template>

                <template if:false={loading}>
                    <slot></slot>
                </template>

            </div>

            <footer class="slds-modal__footer">
                <button class="slds-button slds-button_neutral" onclick={handleClose}>
                    Close
                </button>
            </footer>

        </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
</template>
