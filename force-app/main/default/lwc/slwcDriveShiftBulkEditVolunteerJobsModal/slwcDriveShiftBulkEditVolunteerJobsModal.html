<template>
    <template if:true={showModal}>
        <c-slwc-custom-modal 
            onclosecustommodal={closeModal} 
            onsavecustommodal={handleSave}
            cancel-btn-label="Cancel"
            save-btn-label="Save"
            header={modalHeader}
            overflow-initial>
            <div slot="content">
                <div class="slds-is-relative">
                    <template if:true={showSpinner}>
                        <lightning-spinner class="spins" size="medium"></lightning-spinner>
                    </template>

                    <c-slwc-page-errors validities={errorMessages}></c-slwc-page-errors>

                    <div class="slds-section-title--divider">
                        Drive Criteria
                    </div>
                    <div class="slds-grid slds-wrap slds-gutters slds-p-around_x-small">
                        <div class="slds-col slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-size_1-of-1 slds-m-bottom--small">
                            <c-slwc-picklist
                                required
                                name="volunteerRole"
                                label="Volunteer Role"
                                unique-key={filters.volunteerRole} 
                                object-api-name="sked__Job__c" 
                                selected-value={filters.volunteerRole}  
                                pick-listfield-api-name="sked_Volunteer_Role__c"
                                onpicklistchange={handleOnFiltersChange}>
                            </c-slwc-picklist>
                        </div>
                        <div class="slds-col slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-size_1-of-1 slds-m-bottom--small">
                            <lightning-input name="quantity" label="Quantity" type="number" value={filters.quantity} onchange={handleOnFiltersChange} autocomplete="off" required></lightning-input>
                        </div>
                    </div>
                    <div class="slds-section-title--divider">
                        Recurrence Dates
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-p-around_x-small">
                        <div class="slds-form-element">
                            <div class="slds-form-element__label">
                                <strong>Selected Recurrence Dates:</strong>
                                <span class="slds-m-left_xx-small">{model.recurrenceDates.length}</span>
                                <span class="slds-text-link slds-text-link_reset slds-m-left_x-small" onclick={openRecurrenceDatesPickerModalData}>
                                    Select Dates
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="slds-section-title--divider">
                        Edit Fields
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-p-around_x-small">
                        <lightning-input name="isLocked" label="Lock" type="checkbox" onchange={handleOnChange} checked={model.isLocked} autocomplete="off"></lightning-input>
                    </div>
                </div>
            </div>
        </c-slwc-custom-modal>

        <c-slwc-recurrence-dates-picker-modal
            drive={drive}
            drive-shift-slot={model}
            selected-days={recurrenceDatesPickerModalData.selectedDays}
            is-open={recurrenceDatesPickerModalData.isOpen}
            onclose={closeRecurrenceDatesPickerModalData}
            onsave={saveRecurrenceDatesPickerModalData}>
        </c-slwc-recurrence-dates-picker-modal>
    </template>
</template>
