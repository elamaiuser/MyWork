<template>
                <label class="slds-form-element__label" for="input">
        <!--            <template if:true={required}>
                        <abbr class="slds-required" title="required">* </abbr>
                    </template> -->
                    <template if:true={showLabel}>
                    {label}
                    </template>
                </label>
                <div class="slds-form-element__control">
                    <input id="input" name="input" value={acValue} list="valueList" placeholder={placeholder}  class="slds-input" type="text" onchange={autoCompleteSelect} onkeyup={autoCompleteAction}/>
                    <datalist id="valueList" class="">
                        <template for:each={values} for:item='item'>
                            <option key={item.key} value={item.value}>{item.value}</option>
                        </template>
                    </datalist>
                </div>
            </template>
