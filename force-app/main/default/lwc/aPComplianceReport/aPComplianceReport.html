<template>
    <lightning-card title="Availability Pattern Compliance Report" icon-name="standard:report">
        <!-- Search Panel -->
        <c-bsf-staffing-report-search-panel
            onselectevent={handleSelectedValues}
            onresetevent={handleResetValues}
            prepopulatevalues={showNothing}
            enablecofilter
            enabledrivetype={showNothing}
            enableviolationtoggle={showNothing}>
        </c-bsf-staffing-report-search-panel>

        <!-- Buttons -->
        <div class="slds-m-top_medium slds-p-horizontal_medium">
            <lightning-button label="Search" variant="brand" onclick={handleSearch}></lightning-button>
            <lightning-button label="View PDF" variant="brand-outline" onclick={handleViewPdf} disabled={disablePdfButton} class="slds-m-left_small"></lightning-button>
            <lightning-button label="Download PDF" variant="neutral" onclick={exportToPdf} disabled={disablePdfButton} class="slds-m-left_small"></lightning-button>
            <lightning-button label="Download Excel" variant="neutral" onclick={exportToExcel} disabled={disablePdfButton} class="slds-m-left_small"></lightning-button>
        </div>

        <!-- Error -->
        <template if:true={hasError}>
            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-top_medium slds-p-horizontal_medium">
                <span class="slds-assistive-text">Error</span>
                <h2>{errorMessageToDisplay}</h2>
            </div>
        </template>

        <!-- Spinner -->
        <template if:true={loaded}>
            <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
        </template>

        <!-- Results Table -->
        <template if:true={hasRecords}>
            <!-- Summary Metric Bar -->
        <div class="slds-p-around_medium slds-box slds-theme_default">
            <div class="slds-grid slds-wrap">
                <div class="slds-col slds-size_1-of-4">
                    <p class="slds-text-title">Total Records</p>
                    <p class="slds-text-heading_small">{totalRecords}</p>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <p class="slds-text-title">Total Violations</p>
                    <p class="slds-text-heading_small">{totalViolations}</p>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <p class="slds-text-title">% Violation</p>
                    <p class="slds-text-heading_small">{violationPercent}%</p>
                </div>
            </div>
        </div>
            <lightning-datatable
                key-field="name"
                data={dataArry}
                columns={columns}
                hide-checkbox-column
                wrap-text-max-lines="5">
            </lightning-datatable>
        </template>

        <!-- PDF Iframe Popup -->
        <template if:true={showPopup}>
            <section class="slds-modal slds-fade-in-open slds-modal_large" role="dialog">
                <div class="slds-modal__container">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={handleClosePopupHandler}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                    </button>
                    <div class="slds-modal__content slds-p-around_medium">
                        <iframe src={getPopUpRedirectUrl} width="100%" height="600px" frameborder="0"></iframe>
                    </div>
                    <div class="slds-modal__footer">
                        <lightning-button label="Download PDF" variant="brand" onclick={exportToPdf}></lightning-button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </lightning-card>
</template>
