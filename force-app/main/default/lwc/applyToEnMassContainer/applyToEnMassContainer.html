<template>
  <div class="header">
    <p class="slds-col"> <b>Mass Opportunity Promotion</b></p>
  </div>
  <lightning-card title="Mass Insert Opportunity Promotion" icon-name="custom:custom65">
    <div class="slds-p-around_small" >
      <div class="header1">
        <div class="demo-only demo-only--sizing slds-grid slds-wrap">
          <div class="slds-size_1-of-3">
            <lightning-combobox name="AccountType" 
                label="Account Type" value={AccountType} 
                options={AccType} onchange={handleChange}>
            </lightning-combobox>
          </div>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <lightning-combobox name="TypDrive" 
                label="Record Type" value={TypDrive} 
                options={options} onchange={handleChange1}>
            </lightning-combobox>
        </div>   
         
        <!--
        <div class="slds-p-around_xx-small">
            <template for:each={TypDrive1} for:item="val">
                <lightning-pill key={val} label={val} name={val} onremove={handleRemove}></lightning-pill>
            </template>
        </div>
          -->

        
        <div class="demo-only demo-only--sizing slds-grid slds-wrap">
          <!-- Region Name -->
          <div class="slds-size_1-of-5">
            <lightning-combobox name="TypDrive" 
                label="Region Name" value={regionlst} placeholder="-Select-"
                options={region} onchange={handleChange2}>
            </lightning-combobox>
          </div> 
          &nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;

          <!-- District Name -->
          <div class="slds-size_1-of-5">            
            <lightning-combobox name="TypDrive" 
                label="District Name" value={region2nd} placeholder="-Select-"
                options={district} onchange={handleChange3}>
            </lightning-combobox>
          </div> 
          &nbsp;&nbsp; &nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;

          <!-- Collection Operation  -->
          <div class="slds-size_1-of-4">
            <lightning-combobox name="TypDrive" 
                label="Collection Operation" value={region3rd} placeholder="-Select-"
                options={collOpp} onchange={handleChange4}>
            </lightning-combobox>
          </div> 

        </div>
      </div>
    </div>
  </lightning-card> 
            <div >  
                <lightning-button label="Search"
                    onclick={handleClick}
                    variant="brand">
                </lightning-button>
            </div>

  <lightning-card title="Opportunity Records" icon-name="custom:custom63">

                  </template>
              </template>
          </div>
  </lightning-card>
-->

  
<div  class="content1"> 
  <div class="slds-float_right">
  <lightning-helptext content="Enter Drive/AM/Other for Delivery ID"></lightning-helptext>
  </div>
  &nbsp;
    <div  class="slds-scrollable" style="height:15rem;width:37rem">
      <lightning-datatable
          key-field="driveid"
          data={data}
          columns={columns}
          onsave={handleSave1}
          draft-values={draftValues}
          onrowselection={getSelectedName}>
      </lightning-datatable>
    </div>  
</div>  

<footer>
  <div class="slds-float_right">
    <div class="slds-button-group" role="group" >

        <div class="slds-truncate" title="drivetype">

        -->

        <div class="slds-truncate" title="drivetype"> 
            <lightning-button variant="brand" label="Apply" title="apply button" onclick={applynow}
