<template>
    <lightning-card title="Task Planning Wizard" icon-name="standard:flow">
        <div class="slds-p-around_medium">
            
            <!-- 1. LOCK STATUS -->
            <template if:true={isPlanningLocked}>
                <div class="slds-notify slds-notify_alert slds-theme_info slds-m-bottom_medium" role="alert">
                    <lightning-icon icon-name="utility:lock" size="x-small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                    <h2><strong>Confirmed Drive:</strong> The plan is locked and cannot be modified here.</h2>
                </div>
            </template>

            <!-- 2. PATH SELECTION -->
            <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                <lightning-radio-group name="activePlanningPath"
                    label="Select Planning Path"
                    options={pathOptions}
                    value={activePlanningPath}
                    onchange={handlePathChangeRequest} 
                    type="button"
                    disabled={isPlanningLocked}>
                </lightning-radio-group>
            </div>

            <!-- 3. MAIN CONTENT -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>

            <template if:true={isDataLoaded}>
                <div class="slds-scrollable_y" style="max-height: 600px;">
                    <template for:each={packageGroups} for:item="packageGroup">
                        <div key={packageGroup.packageId} class={packageGroup.containerClass}>
                            
                            <!-- PACKAGE HEADER -->
                            <div class="slds-section__title slds-theme_shade slds-p-around_small">
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <div class="slds-col slds-grow-none slds-m-right_small">
                                        <lightning-button-icon icon-name={packageGroup.chevronIcon} variant="bare" 
                                            data-package-id={packageGroup.packageId} onclick={handleToggleSection}>
                                        </lightning-button-icon>
                                    </div>

                                    <div class="slds-col slds-grid slds-grid_vertical-align-center">
                                        <template if:true={packageGroup.isStandard}>
                                            <strong>{packageGroup.name}</strong>
                                            <lightning-badge label="Required" class="slds-theme_success slds-m-left_small"></lightning-badge>
                                        </template>

                                        <template if:false={packageGroup.isStandard}>
                                            <lightning-input type="checkbox" label={packageGroup.name} 
                                                checked={packageGroup.isAllSelected} data-package-id={packageGroup.packageId} 
                                                onchange={handleSelectAllInGroup} disabled={isPlanningLocked}>
                                            </lightning-input>
                                        </template>
                                    </div>

                                    <div class="slds-col slds-text-align_right">
                                        <span class="slds-badge">{packageGroup.selectedCount} Tasks</span>
                                    </div>
                                </div>
                            </div>

                            <!-- TASK TABLE -->
                            <div class="slds-section__content slds-p-horizontal_small">
                                <table class="slds-table slds-table_bordered">
                                    <thead>
                                        <tr class="slds-text-title_caps">
                                            <th style="width: 40px;"></th>
                                            <th>Task Description</th>
                                            <th style="width: 250px;">Timing Configuration</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={packageGroup.tasks} for:item="taskItem">
                                            <tr key={taskItem.uniqueKey} class={taskItem.rowClass}>
                                                <td>
                                                    <lightning-input type="checkbox" checked={taskItem.isChecked}
                                                        disabled={taskItem.isLocked} data-task-id={taskItem.taskDefinitionId}
                                                        data-package-id={packageGroup.packageId} onchange={handleTaskSelection}>
                                                    </lightning-input>
                                                </td>
                                                <td>
                                                    <div class="slds-grid slds-grid_vertical-align-center">
                                                        <span class="slds-truncate" title={taskItem.subject}>{taskItem.subject}</span>
                                                        <template if:true={taskItem.description}>
                                                            <lightning-helptext content={taskItem.description} class="slds-m-left_xx-small"></lightning-helptext>
                                                        </template>
                                                    </div>
                                                </td>
                                                <td>
                                                    <template if:true={taskItem.isDriveDependent}>
                                                        <div class="slds-grid slds-grid_vertical-align-center">
                                                            <lightning-input type="number" variant="label-hidden"
                                                                value={taskItem.userOffset} disabled={taskItem.isInputDisabled}
                                                                data-task-id={taskItem.taskDefinitionId} data-package-id={packageGroup.packageId}
                                                                onchange={handleOffsetChange} class="short-input" min="0">
                                                            </lightning-input>
                                                            <span class="slds-text-body_small slds-m-left_x-small">{taskItem.offsetLabel}</span>
                                                        </div>
                                                    </template>
                                                    <template if:false={taskItem.isDriveDependent}>
                                                        <lightning-input type="date" variant="label-hidden"
                                                            value={taskItem.userDate} disabled={taskItem.isInputDisabled}
                                                            data-task-id={taskItem.taskDefinitionId} data-package-id={packageGroup.packageId}
                                                            onchange={handleDateChange}>
                                                        </lightning-input>
                                                    </template>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </template>
                </div>

                <div class="slds-m-top_medium footer-sticky">
                    <template if:false={isPlanningLocked}>
                        <lightning-button label="Persist Plan" variant="brand" onclick={persistTaskPlan} class="slds-button_stretch"></lightning-button>
                    </template>
                </div>
            </template>
        </div>

        <!-- PATH CHANGE MODAL -->
        <template if:true={isPathChangeModalOpen}>
            <section role="dialog" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Confirm Path Transition</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium slds-text-align_center">
                        <p>Are you sure you want to change the planning path? Existing configurations may be reset.</p>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={cancelPathChange}></lightning-button>
                        <lightning-button label="Confirm" variant="brand" onclick={executePathChange} class="slds-m-left_small"></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
