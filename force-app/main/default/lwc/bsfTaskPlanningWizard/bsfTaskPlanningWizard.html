<template>
    <lightning-card title="Task Planning Wizard" icon-name="standard:flow">
        <div class="slds-p-around_medium">
            
            <!-- 1. READ ONLY NOTIFICATION -->
            <!-- Displayed when the Drive is Confirmed -->
            <template if:true={isReadOnly}>
                <div class="slds-notify slds-notify_alert slds-theme_info slds-m-bottom_medium" role="alert">
                    <span class="slds-assistive-text">info</span>
                    <span class="slds-icon_container slds-icon-utility-user slds-m-right_x-small">
                        <lightning-icon icon-name="utility:lock" size="x-small" variant="inverse"></lightning-icon>
                    </span>
                    <h2>
                        <strong>Confirmed Drive:</strong> The plan is locked. Please manage tasks directly on the Timeline.
                    </h2>
                </div>
            </template>

            <!-- 2. PATH SELECTION -->
            <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                <lightning-radio-group name="pathOptions"
                    label="Select Planning Path"
                    options={pathOptions}
                    value={selectedPath}
                    onchange={handlePathChangeRequest} 
                    type="button"
                    disabled={isReadOnly}>
                </lightning-radio-group>
            </div>

            <!-- 3. LOADER -->
            <template if:true={isLoading}>
                <div class="slds-p-around_large slds-text-align_center">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>

            <!-- 4. PACKAGE BUNDLES -->
            <template if:true={showBundles}>
                <div class="slds-scrollable_y" style="max-height: 600px;">
                    
                    <template for:each={bundleList} for:item="bundle">
                        
                        <!-- Dynamic Section Class handles Expand/Collapse visibility -->
                        <div key={bundle.id} class={bundle.sectionClass}>
                            
                            <!-- A. HEADER ROW -->
                            <div class="slds-section__title slds-theme_shade slds-p-around_small">
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    
                                    <!-- Chevron Button -->
                                    <div class="slds-col slds-grow-none slds-m-right_small">
                                        <lightning-button-icon icon-name={bundle.chevronIcon} variant="bare" 
                                            data-bundle-id={bundle.id} onclick={handleToggleSection}
                                            alternative-text="Toggle Section">
                                        </lightning-button-icon>
                                    </div>

                                    <!-- Title & Selection Controls -->
                                    <div class="slds-col slds-grid slds-grid_vertical-align-center">
                                        
                                        <!-- Scenario: Standard/Required Package (Locked Label) -->
                                        <template if:true={bundle.isStandard}>
                                            <strong>{bundle.name}</strong>
                                            <lightning-badge label="Standard" class="slds-theme_success slds-m-left_small"></lightning-badge>
                                        </template>

                                        <!-- Scenario: Flexible Package (Checkbox) -->
                                        <template if:false={bundle.isStandard}>
                                            <lightning-input type="checkbox" label={bundle.name} 
                                                class="header-checkbox" checked={bundle.isAllSelected}
                                                data-bundle-id={bundle.id} onchange={handleSelectAll}
                                                disabled={isReadOnly}>
                                            </lightning-input>
                                        </template>
                                    </div>

                                    <!-- Count Badge -->
                                    <div class="slds-col slds-text-align_right">
                                        <span class="slds-badge">{bundle.selectedCount} Selected</span>
                                    </div>
                                </div>
                            </div>

                            <!-- B. TASK TABLE CONTENT -->
                            <div class="slds-section__content slds-p-horizontal_small">
                                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                    <thead>
                                        <tr class="slds-text-title_caps">
                                            <th style="width: 40px;"></th> <!-- Checkbox Col -->
                                            <th>Task Name</th>
                                            <th style="width: 250px;">Task Due Date Configuration</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={bundle.tasks} for:item="task">
                                            <tr key={task.uniqueKey} class={task.rowClass}>
                                                
                                                <!-- Checkbox -->
                                                <td>
                                                    <lightning-input type="checkbox" checked={task.isChecked}
                                                        disabled={task.isLocked} data-task-id={task.id}
                                                        data-bundle-id={bundle.id} onchange={handleTaskCheck}>
                                                    </lightning-input>
                                                </td>

                                                <!-- Task Name + Info Icon -->
                                                <td>
                                                    <div class="slds-grid slds-grid_vertical-align-center">
                                                        <div class="slds-truncate slds-m-right_x-small" title={task.subject}>
                                                            {task.subject}
                                                        </div>
                                                        <template if:true={task.description}>
                                                            <lightning-helptext content={task.description}></lightning-helptext>
                                                        </template>
                                                    </div>
                                                </td>

                                                <!-- Input Fields (Conditional based on Method) -->
                                                <td>
                                                    <!-- 1. Days Offset (Number) -->
                                                    <template if:true={task.isDaysOffset}>
                                                        <div class="slds-grid slds-gutters slds-grid_vertical-align-center">
                                                            <div class="slds-col slds-grow-none">
                                                                <lightning-input type="number" variant="label-hidden"
                                                                    value={task.userOffset} disabled={task.inputDisabled}
                                                                    data-task-id={task.id} data-bundle-id={bundle.id}
                                                                    onchange={handleOffsetChange} class="short-input"
                                                                    min="0">
                                                                </lightning-input>
                                                            </div>
                                                            <div class="slds-col">
                                                                <!-- Dynamic Label: "Days Prior" or "Days After" -->
                                                                <span class="slds-text-body_small">{task.offsetLabel}</span>
                                                            </div>
                                                        </div>
                                                    </template>

                                                    <!-- 2. Target Date (Calendar) -->
                                                    <template if:false={task.isDaysOffset}>
                                                        <div class="slds-grid slds-gutters slds-grid_vertical-align-center">
                                                            <div class="slds-col">
                                                                <lightning-input type="date" variant="label-hidden"
                                                                    value={task.userDate} disabled={task.inputDisabled}
                                                                    data-task-id={task.id} data-bundle-id={bundle.id}
                                                                    onchange={handleDateChange}>
                                                                </lightning-input>
                                                            </div>
                                                            <div class="slds-col">
                                                                <span class="slds-text-body_small">Due Date</span>
                                                            </div>
                                                        </div>
                                                    </template>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Footer / Save Button -->
                <div class="slds-m-top_medium footer-sticky">
                    <template if:false={isReadOnly}>
                        <lightning-button label="Save Plan" variant="brand" onclick={handleSave} class="slds-size_full slds-button_stretch"></lightning-button>
                    </template>
                </div>
            </template>
        </div>

        <!-- 5. CONFIRMATION MODAL -->
        <template if:true={showConfirmation}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Confirm Path Change</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-text-align_center">
                            Recruitment Team confirming w/ Process
                            <br/><br/>
                            <strong>Proceed with path change?</strong>
                        </p>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" variant="neutral" onclick={cancelPathChange}></lightning-button>
                        <lightning-button label="Confirm" variant="brand" onclick={confirmPathChange} class="slds-m-left_small"></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </lightning-card>
</template>
