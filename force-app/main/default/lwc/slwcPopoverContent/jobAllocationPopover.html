<template>
    <div class="job-allocation-resource-card-popover">
        <div class="hco-resource-info">
            <div class="slds-media direction-ltr">
                <div class="slds-media__figure">
                    <lightning-avatar fallback-icon-name={popoverData.icon} src={popoverData.resource.photoUrl}>
                    </lightning-avatar>
                </div>
                <div class="slds-media__body">
                    <h5 class="slds-page-header__subtitle slds-truncate slds-align-middle">
                        <strong class="color-text-link-hover">
                            <c-slwc-resource-name resource={popoverData.resource}></c-slwc-resource-name>
                        </strong>
                    </h5>
                    <div class="slds-page-header__subtitle slds-text-body_small direction-ltr">
                        <p if:true={popoverData.additionalRolesString}
                        class="slds-text-color_weak slds-text-body_small hco-resource-region-info color-default-text" style="white-space: normal;">
                        {popoverData.additionalRolesString}</p>
                        <p if:true={popoverData.resource.category}
                        class="slds-text-color_weak slds-text-body_small hco-resource-region-info color-default-text">
                        {popoverData.resource.category}</p>
                        <p if:true={popoverData.resource.collectionOperationName}
                            class="slds-text-color_weak slds-text-body_small hco-resource-category-info slds-truncate slds-text-color_inverse-weak">
                            <lightning-icon class="slds-current-color slds-m-right--xx-small" icon-name="utility:checkin"
                                size="xx-small">
                            </lightning-icon>{popoverData.resource.collectionOperationName}
                        </p>
                        <p if:true={popoverData.resource.primaryPhone}
                            class="slds-text-color_weak slds-text-body_small hco-resource-category-info slds-truncate slds-text-color_inverse-weak">
                            <lightning-icon class="slds-current-color slds-m-right--xx-small" icon-name="utility:call"
                                size="xx-small">
                            </lightning-icon>{popoverData.resource.primaryPhone}
                        </p>
                        <p if:true={popoverData.resource.email}
                            class="slds-text-color_weak slds-text-body_small hco-resource-email-info slds-text-color_inverse-weak" style="word-break: break-all; white-space: normal;">
                            <lightning-icon class="slds-current-color slds-m-right--xx-small" icon-name="utility:email"
                                size="xx-small">
                            </lightning-icon>{popoverData.resource.email}
                        </p>
                        <p
                            class="slds-text-color_weak slds-text-body_small hco-resource-email-info slds-text-color_inverse-weak" style="word-break: break-all; white-space: normal;">
                            <lightning-icon class="slds-current-color slds-m-right--xx-small" icon-name="utility:clock"
                                size="xx-small">
                            </lightning-icon>
                            <lightning-formatted-date-time value={jobAllocationStartWithTravelTime} hour="2-digit"
                                minute="2-digit" hour12="true" time-zone={timezone}>
                            </lightning-formatted-date-time>
                            <span class="slds-p-horizontal_xx-small">-</span>
                            <lightning-formatted-date-time value={jobAllocationEndWithTravelTime} hour="2-digit"
                                minute="2-digit" hour12="true" time-zone={timezone}>
                            </lightning-formatted-date-time>
                        </p>
                    </div>
                </div>

                <strong if:true={popoverData.locked}>Locked</strong>
                <strong if:true={popoverData.guarded}>Guarded</strong>
            </div>

            <div class="slds-media__body direction-ltr">
                <div class="slds-m-top--small slds-border_top"
                    style="min-width: 128px;">
                    <div for:each={popoverData.resource.resourceTagsDisplay} for:item="resourceTag" key={resourceTag.keyRender} class="slds-text-body_small slds-grid_vertical-align-center slds-has-flexi-truncate">
                        <p class="slds-has-flexi-truncate color-default-text slds-m-vertical_xx-small" >
                            {resourceTag.value} {resourceTag.key}(s)
                        </p>
                        <div class="slds-text-body_small slds-grid_vertical-align-center slds-has-flexi-truncate slds-m-vertical_xx-small slds-grid slds-wrap">
                            <span for:each={resourceTag.details} for:item="tag" key={tag.key} class="slds-text-color_inverse-weak whitespace-nowrap">
                                <lightning-icon if:true={tag.isRestricted} class="slds-m-left_x-small slds-m-right_xx-small slds-icon-standard-home" icon-name="standard:quotes" size="x-small"></lightning-icon>
                                <lightning-icon if:false={tag.isRestricted} class="slds-m-left_x-small slds-m-right_xx-small" icon-name="standard:quotes" size="x-small"></lightning-icon>
                                {tag.value} <span class="slds-m-left__x-small" if:true={tag.isRestricted}>(Restricted)</span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="slds-border_top slds-m-top_x-small direction-ltr" if:true={popoverData.exceptionLog.length}>
                <div for:each={popoverData.exceptionLog} for:item="exception" key={exception.exception}
                    class="slds-text-body_small slds-grid_vertical-align-center slds-has-flexi-truncate">
                    <p class="color-default-text slds-m-vertical_xx-small color-error" style="white-space: normal;">
                        {exception.exception}
                    </p>
                </div>

                <div if:true={popoverData.staffingReason} class="slds-text-body_small slds-grid_vertical-align-center slds-has-flexi-truncate">
                    <p class="color-default-text slds-m-vertical_xx-small" style="white-space: normal;">
                        Staffing Reason: {popoverData.staffingReason}
                    </p>
                </div>
            </div>

            <div class="slds-m-top_x-small trade-shift-section" if:true={popoverData.hasDriveShiftTrade}>
                <div class="header">
                    <div>Traded Event</div>
                </div>
                <dl class="slds-dl_horizontal content">
                    <dt class="slds-dl_horizontal__label slds-text-color_weak slds-m-bottom_xx-small">Requesting Staff:</dt>
                    <dd class="slds-dl_horizontal__detail  slds-m-bottom_xx-small">
                        {popoverData.driveShiftTrade.requestingStaffName}
                    </dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak slds-m-bottom_xx-small">Event:</dt>
                    <dd class="slds-dl_horizontal__detail  slds-m-bottom_xx-small">
                        {popoverData.driveShiftTrade.requestingStaffTradingEventName}
                    </dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak slds-m-bottom_xx-small">Event Date:</dt>
                    <dd class="slds-dl_horizontal__detail  slds-m-bottom_xx-small">
                        <lightning-formatted-date-time value={popoverData.driveShiftTrade.requestingStaffTradingEventDate} year="numeric" month="short" day="2-digit" time-zone="UTC"></lightning-formatted-date-time>
                    </dd>
                    <div class="slds-has-divider_top slds-m-vertical_x-small slds-size_1-of-1"></div>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak slds-m-bottom_xx-small">Trading Staff:</dt>
                    <dd class="slds-dl_horizontal__detail  slds-m-bottom_xx-small">
                        {popoverData.driveShiftTrade.tradingStaffName}
                    </dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak slds-m-bottom_xx-small">Event:</dt>
                    <dd class="slds-dl_horizontal__detail  slds-m-bottom_xx-small">
                        {popoverData.driveShiftTrade.tradingStaffTradingEventName}
                    </dd>
                    <dt class="slds-dl_horizontal__label slds-text-color_weak slds-m-bottom_xx-small">Event Date:</dt>
                    <dd class="slds-dl_horizontal__detail  slds-m-bottom_xx-small">
                        <lightning-formatted-date-time value={popoverData.driveShiftTrade.tradingStaffTradingEventDate} year="numeric" month="short" day="2-digit" time-zone="UTC"></lightning-formatted-date-time>
                    </dd>
                    <template if:true={popoverData.driveShiftTrade.apsNotes}>
                        <dt class="slds-dl_horizontal__label slds-text-color_weak slds-m-bottom_xx-small">APS Notes:</dt>
                        <div class="white-space_prewrap">{popoverData.driveShiftTrade.apsNotes}</div>
                    </template>
                </dl>
            </div>
        </div>

        <template if:false={readOnly}>
            <footer class="slds-popover__footer slds-text-align_right">
                <div class="slds-grid slds-wrap slds-grid--align-spread direction-rtl">
                    <template if:false={popoverData.isLocked}>
                        <span if:true={isPerson}>
                            <button class="slds-button direction-ltr"
                                data-action="unallocate"
                                onclick={handleAddRolePopoverAction}>
                                <lightning-icon icon-name="utility:add" class="slds-current-color" size="xx-small"></lightning-icon>&nbsp;Add Role
                            </button>
                        </span>
                        <template if:true={isPerson}>
                            <span>
                                <button class="slds-button direction-ltr"
                                    data-action="edit"
                                    onclick={handleJobAllocationPopoverAction}>
                                    <lightning-icon icon-name="utility:edit" class="slds-current-color" size="xx-small"></lightning-icon>&nbsp;Edit Times
                                </button>
                            </span>
                        </template>
                    </template>
                    <span if:true={popoverData.locked}>
                        <button class="slds-button direction-ltr"
                            data-action="lock"
                            onclick={handleJobAllocationPopoverAction}>
                            <lightning-icon icon-name="utility:unlock" class="slds-current-color" size="xx-small"></lightning-icon>&nbsp;Unlock
                        </button>
                    </span>
                    <span if:true={popoverData.guarded}>
                        <button class="slds-button direction-ltr"
                            data-action="guard"
                            onclick={handleJobAllocationPopoverAction}>
                            <lightning-icon icon-name="utility:unlock" class="slds-current-color" size="xx-small"></lightning-icon>&nbsp;Unguard
                        </button>
                    </span>
                    <template if:false={popoverData.isLocked}>
                        <span>
                            <button class="slds-button direction-ltr"
                                data-action="lock"
                                onclick={handleJobAllocationPopoverAction}>
                                <lightning-icon icon-name="utility:lock" class="slds-current-color" size="xx-small"></lightning-icon>&nbsp;Lock
                            </button>
                        </span>
                        <span>
                            <button class="slds-button direction-ltr"
                                data-action="guard"
                                onclick={handleJobAllocationPopoverAction}>
                                <lightning-icon icon-name="utility:shield" class="slds-current-color" size="xx-small"></lightning-icon>&nbsp;Guard
                            </button>
                        </span>
                    </template>
                    <template if:false={popoverData.isLocked}>
                        <span class="btn-delete">
                            <button class="slds-button direction-ltr"
                                data-action="unallocate"
                                onclick={handleJobAllocationPopoverAction}>
                                <lightning-icon icon-name="utility:delete" class="slds-current-color" size="xx-small"></lightning-icon>&nbsp;Unallocate
                            </button>
                        </span>
                        <template if:false={disabledCallOut}>
                            <template if:true={isPerson}>
                                <span if:true={isShowCallOut} class="btn-delete">
                                    <button class="slds-button direction-ltr"
                                        data-action="callOut"
                                        onclick={handleJobAllocationPopoverAction}>
                                        <lightning-icon icon-name="utility:outbound_call" class="slds-current-color" size="xx-small"></lightning-icon>&nbsp;Call Out
                                    </button>
                                </span>
                            </template>
                        </template>
                    </template>
                </div>
            </footer>
        </template>
    </div>
</template>
