<template>
    <lightning-card title="Time Block Compliance Report" icon-name="standard:report">
        <!-- Search Panel -->
        <c-bsf-staffing-report-search-panel onselectevent={handleSelectedValues} onresetevent={handleResetValues}
            prepopulatevalues={showNothing} enablecofilter enabledrivetype={showNothing}
            enableviolationtoggle={showNothing}>
        </c-bsf-staffing-report-search-panel>

        <!-- Custom Filters -->
        <div class="slds-grid slds-wrap slds-p-horizontal_medium slds-m-top_medium">

            <!-- Drive Status -->
            <div class="slds-col slds-size_1-of-2 slds-p-right_small">
                <c-bsf-multi-select-combobox
                    name="driveStatus"
                    label="Drive Status"
                    placeholder="-Select-"
                    options={driveStatusOptions}
                    onchange={handleDriveStatusChange}
                    onclickevent={handleDriveStatusClick}>
                </c-bsf-multi-select-combobox>
            </div>

            <!-- Time Block -->
            <div class="slds-col slds-size_1-of-2 slds-p-left_small">
                <c-bsf-multi-select-combobox
                    name="timeBlock"
                    label="Time Block"
                    placeholder="-Select-"
                    options={timeBlockOptions}
                    onchange={handleTimeBlockChange}>
                </c-bsf-multi-select-combobox>
            </div>

            <!-- Show Violations -->
            <div class="slds-col slds-size_1-of-2 slds-p-right_small slds-m-top_small">
                <lightning-input
                    type="checkbox"
                    label="Show Violations Only"
                    checked={wrapper.violationOnly}
                    onchange={handleViolationToggleChange}>
                </lightning-input>
            </div>

            <!-- Account Manager Name -->
            <div class="slds-col slds-size_1-of-2 slds-p-left_small slds-m-top_small">
                <lightning-input
                    label="Account Manager Name"
                    name="accountManager"
                    placeholder="Enter name (optional)"
                    onchange={handleAccountManagerInput}>
                </lightning-input>
            </div>

        </div>


        <!-- Action Buttons -->
        <div class="slds-m-top_medium slds-p-horizontal_medium">            
            <lightning-button label="Search" variant="brand" onclick={handleSearch}></lightning-button>
            <template if:false={Hide}>
                <lightning-button label="View PDF" variant="brand-outline" onclick={handleViewPdf}
                disabled={disablePdfButton} class="slds-m-left_small"></lightning-button>
                <lightning-button label="Download PDF" variant="neutral" onclick={exportToPdf} disabled={disablePdfButton}
                class="slds-m-left_small"></lightning-button>
            </template>
            <lightning-button label="Download Excel" variant="neutral" onclick={exportToExcel}
            disabled={disablePdfButton} class="slds-m-left_small"></lightning-button>
        </div>

        <!-- Spinner -->
        <template if:true={loaded}>
            <div class="slds-p-horizontal_medium slds-m-top_medium">
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Error Message -->
        <template if:true={hasError}>
            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-top_medium slds-p-horizontal_medium">
                <span class="slds-assistive-text">Error</span>
                <h2>{errorMessageToDisplay}</h2>
            </div>
        </template>

        <!-- Data Table -->
        <template if:true={hasRecords}>
            <div class="slds-grid slds-p-around_small slds-border_bottom slds-m-bottom_x-small">
                <div class="slds-col slds-size_1-of-3">
                    <strong>Total Records:</strong> {totalRecords}
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <strong>Compliant:</strong> {totalCompliant}
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <strong>Compliance %:</strong> {compliancePercent}
                </div>
            </div>
            <div class="scroll-wrapper">
                <div class="scroll-inner">
                    <lightning-datatable
                        style="min-width: 2000px;"
                        key-field="driveName"
                        data={dataArry}
                        columns={columns}
                        hide-checkbox-column
                        wrap-text-max-lines="5">
                    </lightning-datatable>
                </div>
            </div>

        </template>
        <!-- PDF Iframe Popup -->
        <template if:true={showPopup}>
            <section class="slds-modal slds-fade-in-open slds-modal_large" role="dialog">
                <div class="slds-modal__container">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        onclick={handleClosePopupHandler}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small"></lightning-icon>
                    </button>
                    <div class="slds-modal__content slds-p-around_medium">
                        <iframe src={getPopUpRedirectUrl} width="100%" height="600px" frameborder="0"></iframe>
                    </div>
                    <div class="slds-modal__footer">
                        <lightning-button label="Download PDF" variant="brand" onclick={exportToPdf}></lightning-button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
