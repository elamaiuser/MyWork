<template>
    <template if:true={showModal}>
        <c-slwc-custom-modal
            onclosecustommodal={handleCloseModal}
            onsavecustommodal={handleSaveModal}
            cancel-btn-label={modalCancelBtnLabel}
            save-btn-label={modalSaveBtnLabel}
            modal-size={modalSize}
            header={modalHeader}
            overflow-initial={modalOverflowInitial}>
            <div slot="content">
                <div class="slds-is-relative">
                    <template if:true={showSpinner}>
                        <lightning-spinner class="spins" size="medium"></lightning-spinner>
                    </template>

                    <template if:true={showStep1}>
                        <c-slwc-page-errors validities={errorMessages}></c-slwc-page-errors>

                        <div class="slds-section-title--divider">
                            Recurrence Dates
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-p-around_x-small">
                            <div class="slds-form-element">
                                <div class="slds-form-element__label">
                                    <strong>Selected Recurrence Dates:</strong>
                                    <span class="slds-m-left_xx-small">{model.recurrenceDates.length}</span>
                                    <span class="slds-text-link slds-text-link_reset slds-m-left_x-small" onclick={openRecurrenceDatesPickerModalData}>
                                        Select Dates
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div class="slds-section-title--divider">
                            Add Fields
                        </div>
                        <div class="slds-grid slds-wrap slds-gutters slds-p-around_x-small">
                            <div class="slds-col slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-size_1-of-1 slds-m-bottom--small">
                                <c-slwc-picklist
                                    required
                                    name="volunteerRole"
                                    label="Volunteer Role"
                                    unique-key={model.volunteerRole}
                                    object-api-name="sked__Job__c"
                                    selected-value={model.volunteerRole}
                                    pick-listfield-api-name="sked_Volunteer_Role__c"
                                    onpicklistchange={handleOnChange}
                                    dropdown-alignment="bottom-left">
                                </c-slwc-picklist>
                            </div>
                            <div class="slds-col slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-size_1-of-1 slds-m-bottom--small">
                                <lightning-input name="redcrossVolunteerQuantity" label="Red Cross Volunteer Quantity" type="number" value={model.redcrossVolunteerQuantity} onchange={handleOnChange} autocomplete="off" required></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom--small">
                                <lightning-input name="isLocked" label="Lock" type="checkbox" onchange={handleOnChange} checked={model.isLocked} autocomplete="off"></lightning-input>
                            </div>
                        </div>

                        <div class="slds-section-title--divider">
                            Volunteer Adjustment Reason
                        </div>
                        <div class="slds-grid slds-wrap slds-gutters slds-p-around_x-small">
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom--small">
                                <c-slwc-picklist
                                    required
                                    name="volunteerAdjustmentReason"
                                    label="Volunteer Adjustment Reason"
                                    unique-key={model.volunteerAdjustmentReason}
                                    object-api-name="sked__Job__c"
                                    selected-value={model.volunteerAdjustmentReason}
                                    pick-listfield-api-name="sked_Volunteer_Adjustment_Reason__c"
                                    onpicklistchange={handleOnChange}
                                    dropdown-alignment="bottom-left">
                                </c-slwc-picklist>
                            </div>
                            <div if:true={isOtherVolunteerAdjustmentReasonSelected} class="slds-col slds-size_1-of-1 slds-m-bottom--small">
                                <lightning-input name="otherVolunteerAdjustmentReason" label="Other Reason" type="text" value={model.otherVolunteerAdjustmentReason} onchange={handleOnChange} autocomplete="off" required></lightning-input>
                            </div>
                        </div>
                    </template>

                    <template if:true={showStep2}>
                        <div class="slds-text-color_error slds-p-bottom_small slds-text-align_center slds-text-heading_small">
                            <p>{appointmentAlertMessage}</p>
                            <p>{appointmentAlertInstructionMessage}</p>
                        </div>

                        <div class="slds-p-horizontal_medium slds-p-vertical_small slds-scrollable_y slds-grow">
                            <div class="job-allocation-table">
                                <div class="header">
                                    <div class="row">
                                        <div class="col-drive-name">Drive Name</div>
                                        <div class="col-drive-status">Drive Status</div>
                                        <div class="col-drive-issue">Issue</div>
                                    </div>
                                </div>
                                <div class="body">
                                    <template for:each={model.daysWithDrives} for:item="day">
                                        <div key={day.dateIso}>
                                            <div class="row sub-header">
                                                <lightning-formatted-date-time value={day.dateIso} year="numeric" month="numeric" day="numeric" time-zone="GMT"></lightning-formatted-date-time>
                                            </div>
                                            <div if:false={day.drives.length} class="row slds-text-color_error slds-p-around_small">No drives</div>
                                            <template for:each={day.drives} for:item="drive">
                                                <div class="row" key={drive.id}>
                                                    <div class="col-drive-name">
                                                        <lightning-formatted-url value={drive.driveRecordUrl} label={drive.name} target="_blank"></lightning-formatted-url>
                                                    </div>
                                                    <div class="col-drive-status">{drive.status}</div>
                                                    <div class="col-drive-issue">
                                                        <template for:each={drive.errorMessages} for:item="errorMessage">
                                                            <div
                                                                key={errorMessage}
                                                                class="slds-text-color_error slds-m-right_xx-small slds-m-bottom_xxx-small slds-m-top_xxx-small">
                                                                {errorMessage}
                                                            </div>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </c-slwc-custom-modal>

        <c-slwc-recurrence-dates-picker-modal
            drive={drive}
            drive-shift-slot={model}
            mode="datesOnly"
            selected-days={recurrenceDatesPickerModalData.selectedDays}
            is-open={recurrenceDatesPickerModalData.isOpen}
            onclose={closeRecurrenceDatesPickerModalData}
            onsave={saveRecurrenceDatesPickerModalData}>
        </c-slwc-recurrence-dates-picker-modal>
    </template>
</template>
