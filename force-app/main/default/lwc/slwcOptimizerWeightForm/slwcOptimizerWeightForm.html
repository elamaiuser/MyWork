<template>
    <div class="slds-grid">
        <div class="slds-size_7-of-12 slds-p-horizontal_small">
            <article class="slds-card">
                <div class="slds-card__header slds-grid">
                    <header class="slds-media slds-media_center slds-has-flexi-truncate">
                        <div class="slds-media__body">
                            <h2 class="slds-card__header-title">
                                <span>Scoring Factors</span>
                            </h2>
                        </div>
                        <div class="slds-no-flex" if:false={isReadonly}>
                            <lightning-button
                                label="Reset"
                                onclick={handleReset}
                                variant="neutral">
                            </lightning-button>
                        </div>
                    </header>
                </div>
                <div class="slds-card__body slds-card__body_inner">
                    <lightning-input
                        type="number"
                        name="highWeight"
                        label="High Weight (0 to 250)"
                        value={collectionOperation.highWeight}
                        required
                        min="0"
                        max="250"
                        variant="label-inline"
                        readonly={isReadonly}
                        onchange={handleOnChange}>
                    </lightning-input>
                    <lightning-input
                        type="number"
                        name="mediumWeight"
                        label="Medium Weight (0 to 150)"
                        value={collectionOperation.mediumWeight}
                        required
                        min="0"
                        max="150"
                        variant="label-inline"
                        readonly={isReadonly}
                        onchange={handleOnChange}>
                    </lightning-input>
                    <lightning-input
                        type="number"
                        name="lowWeight"
                        label="Low Weight (0 to 50)"
                        value={collectionOperation.lowWeight}
                        required
                        min="0"
                        max="50"
                        variant="label-inline"
                        readonly={isReadonly}
                        onchange={handleOnChange}>
                    </lightning-input>
                    <lightning-input
                        type="number"
                        name="rolePrioritiesWeight"
                        label="Role Priorities Weight"
                        value={collectionOperation.rolePrioritiesWeight}
                        required
                        min="0"
                        variant="label-inline"
                        readonly={isReadonly}
                        onchange={handleOnChange}>
                    </lightning-input>
                </div>
            </article>
        </div>
    </div>
</template>
