<template>

    <template if:true={isShowModal}>

        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={hideModalBox}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Generate Pending DCR</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <div class="main-background-color slds-p-around_medium">

                        <div class="slds-col slds-grid">
                            <div class="slds-col slds-size_4-of-12 slds-p-right_xx-large">

                                <div class="slds-size_1-of-4 ">
                                    <label>From Drive Date</label>
                                </div>

                                <div class="slds-size_3-of-4 ">
                                    <lightning-input type="date" variant="label-hidden" data-name="fromDriveDate"
                                        name="fromDriveDate" onblur={validationCheck}></lightning-input>
                                </div>

                            </div>
                            <div class="slds-col slds-size_4-of-12">

                                <div class="slds-size_1-of-4 ">
                                    <label>Start Time From</label>
                                </div>
                                <div class="slds-size_3-of-4 ">
                                    <lightning-input type="time" variant="label-hidden" data-name="startTimeFrom"
                                        name="startTimeFrom" onblur={validationCheck}></lightning-input>
                                </div>

                            </div>
                            <div class="slds-col slds-size_4-of-12 slds-p-left_large">

                                <div class="slds-size_1-of-4 ">
                                    <label>End Time From</label>
                                </div>
                                <div class="slds-size_3-of-4 ">
                                    <lightning-input type="time" variant="label-hidden" data-name="endTimeFrom"
                                        name="endTimeFrom" onblur={validationCheck}></lightning-input>
                                </div>

                            </div>
                        </div>

                        <br></br>

                        <div class="slds-col slds-grid">

                            <div class="slds-col slds-size_4-of-12 slds-p-right_xx-large">

                                <div class="slds-size_1-of-4 ">
                                    <label>To Drive Date</label>
                                </div>
                                <div class="slds-size_3-of-4 ">
                                    <lightning-input type="date" variant="label-hidden" data-name="toDriveDate"
                                        name="toDriveDate" onblur={validationCheck}></lightning-input>
                                </div>

                            </div>
                            <div class="slds-col slds-size_4-of-12">
                                <div class="slds-size_1-of-4 ">
                                    <label>Start Time To</label>
                                </div>
                                <div class="slds-size_3-of-4 ">
                                    <lightning-input type="time" variant="label-hidden" data-name="startTimeTo"
                                        name="startTimeTo" onblur={validationCheck}></lightning-input>
                                </div>

                            </div>
                            <div class="slds-col slds-size_4-of-12 slds-p-left_large">
                                <div class="slds-size_1-of-4 ">
                                    <label>End Time To</label>
                                </div>
                                <div class="slds-size_3-of-4 ">
                                    <lightning-input type="time" variant="label-hidden" data-name="endTimeTo"
                                        name="endTimeTo" onblur={validationCheck}></lightning-input>
                                </div>

                            </div>

                        </div>

                        <br></br>

                        <div class="slds-col slds-grid slds-size_6-of-12">

                            <div class="slds-size_4-of-6">
                                <div class="slds-col">
                                    Drive Status
                                </div>

                                <div class="slds-col">

                                    <template if:true={label}>
                                        <label class="slds-form-element__label">{label}</label>
                                    </template>
                                    <div class="slds-combobox_container">
                                        <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open"
                                            aria-expanded="true" aria-haspopup="listbox" role="combobox">
                                            <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
                                                role="none">
                                                <lightning-input disabled={disabled} class="inputBox"
                                                    placeholder="Select an Option" onblur={blurEvent}
                                                    onclick={showOptions} onkeyup={filterOptions}
                                                    auto-complete="off" variant="label-hidden"
                                                    id="combobox-id-1"></lightning-input>
                                                <lightning-icon class="slds-input__icon" icon-name="utility:down"
                                                    size="x-small" alternative-text="search"></lightning-icon>
                                            </div>
                                            <template if:true={showDropdown}>
                                                <div id="listbox-id-1"
                                                    class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid">
                                                    <ul class="slds-listbox slds-listbox_vertical recordListBox"
                                                        role="presentation">
                                                        <template if:false={message}>
                                                            <template for:each={optionData} for:item="option">
                                                                <template if:true={option.isVisible}>
                                                                    <li key={option.value} data-id={option.value}
                                                                        onmousedown={selectItem}
                                                                        class="slds-listbox__item eachItem">
                                                                        <template if:true={option.selected}>
                                                                            <lightning-icon icon-name="utility:check"
                                                                                size="x-small"
                                                                                alternative-text="icon"></lightning-icon>
                                                                        </template>
                                                                        <span
                                                                            class="slds-media slds-listbox__option_entity verticalAlign slds-truncate">{option.label}</span>
                                                                    </li>
                                                                </template>
                                                            </template>
                                                        </template>
                                                        <template if:true={message}>
                                                            <li class="slds-listbox__item">
                                                                <span
                                                                    class="slds-media slds-listbox__option_entity verticalAlign slds-truncate">{message}</span>
                                                            </li>
                                                        </template>
                                                    </ul>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                    <template for:each={optionData} for:item="option">
                                        <template if:true={option.selected}>
                                            <lightning-pill key={option.value} class="slds-m-around_xx-small"
                                                name={option.value} label={option.label}
                                                onremove={removePill}></lightning-pill>
                                        </template>
                                    </template>
                                </div>

                            </div>
                        </div>
                        <div class="slds-col slds-grid">
                            <div class="slds-size_1-of-2">
                                <div class="align-at-end slds-m-right_large">
                                    <lightning-button variant="brand" icon-name="utility:refresh" label="Reset"
                                        onclick={handleReset}></lightning-button>
                                </div>
                            </div>
                            <div class="slds-size_1-of-2">
                                <div class="slds-m-left_large align-at-left">
                                    <lightning-button variant="brand" icon-name="utility:filter" label="Filter"
                                        disabled={isButtonIsVisible} onclick={handleFilter}></lightning-button>
                                </div>
                            </div>

                        </div>

                        <br></br>
                        <div>
                            <div class="slds-scrollable_y set-border-around" style="height: 45vh; position:relative;">
                                <template if:true={loaded}>
                                    <lightning-spinner alternative-text="Loading"></lightning-spinner>
                                </template>
                                <lightning-datatable key-field="id" data={data} show-row-number-column
                                    row-number-offset={rowOffset} columns={columns}>
                                </lightning-datatable>
                            </div>
                        </div>

                        <br></br>

                    </div>
                </div>

                <footer class="slds-modal__footer">

                    <div class="slds-col slds-grid">
                        <div class="slds-size_1-of-2">
                            <div class="align-at-end slds-m-right_large">
                                <lightning-button variant="destructive" label="Cancel"
                                    icon-name="utility:cancel_file_request" onclick={handleCancel}
                                    class="slds-m-left_x-small"></lightning-button>
                            </div>
                        </div>

                        <div class="slds-size_1-of-2">
                            <div class="slds-m-left_large align-at-left">
                                <lightning-button variant="brand" icon-name="utility:approval"
                                    label="Generate Pending DCR" disabled={isButtonIsVisible}
                                    onclick={handleGeneratePendingDCR}></lightning-button>
                            </div>
                        </div>

                    </div>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
