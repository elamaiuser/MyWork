<template>
    <template if:true={showSpinner}>
        <lightning-spinner class="spins" size="medium"></lightning-spinner>
    </template>

    <div class="slds-grid slds-grid_vertical">
        <div class="slds-col">
            <div class="slds-clearfix slds-page-header slds-page-header_record-home fixed-position" style="margin-bottom: var(--lwc-cardSpacingMargin);">
                <div class="slds-page-header__row slds-grid_vertical-align-center">
                    <div class="slds-page-header__col-title">
                        <div class="slds-media">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="standard:approval" size="medium"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <div class="slds-page-header__name">
                                    <div class="slds-page-header__name-title">
                                        <h1>
                                            <span>Mass Opporutunity Updates</span>
                                            <span class="slds-page-header__title slds-truncate">Pending Drive Change Requests</span>
                                        </h1>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="slds-no-flex">
                        <div class="slds-grid">
                            <div class="slds-col">
                                <lightning-button-icon tooltip="Refresh" variant="border-filled" onclick={handleRefreshButton} icon-name="utility:refresh"></lightning-button-icon>
                            </div>
                            <div class="slds-col slds-p-left_x-small">
                                <lightning-button-group>
                                    <lightning-button label="Run all Pending Requests" onclick={handleRunAllButton}></lightning-button>
                                </lightning-button-group>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="slds-tabs_card" style="height:100%; margin-bottom: var(--lwc-cardSpacingMargin);">
                <div if:false={driveChangeRequests.length} class="slds-align_absolute-center slds-p-around_large">
                    <lightning-icon icon-name="utility:warning" size="x-small" alternative-text="Warning!" title="Warning"></lightning-icon>
                    <span class="slds-m-left--small">There are no pending requests.</span>
                </div>
                <div if:true={driveChangeRequests.length}>
                    <div class="slds-scrollable_y">
                        <c-slwc-custom-datatable 
                            key-field="id"  
                            data={driveChangeRequests}
                            columns={COLUMNS}
                            hide-checkbox-column
                            wrap-text-max-lines="3">
                        </c-slwc-custom-datatable>
                    </div>
                    <div class="slds-shrink-none slds-grow-none slds-p-horizontal_small slds-p-vertical_small slds-border_top modal-content__footer">
                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center"> 
                            <div class="slds-text-color_weak ng-binding">Total records: {driveChangeRequests.length} </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <template if:true={runAllModalData.isOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open" if:true={runAllModalData.isOpen}>
            <div class="slds-modal__container" style="transform: initial; min-width: 48rem; width: 48rem;">
                <header class="slds-modal__header">
                    <lightning-button-icon onclick={closeRunAllModal} class="slds-button slds-button_icon slds-modal__close" size="large"
                        icon-name="utility:close" variant="bare-inverse" title="Close"></lightning-button-icon>
    
                    <h2 class="slds-modal__title slds-hyphenate">Drive Generator</h2>
                </header>
                <div class="slds-modal__content">
                    <div class="slds-is-relative">
                        <div class="slds-p-around_medium">
                            <div>
                                <strong>Total records:</strong> {runAllModalData.records.length}
                            </div>
                            <div class="slds-m-top_xx-small">
                                <strong>Total processed records:</strong> {runAllModalData.processedRecords.length}
                            </div>
                            <template if:true={runAllModalData.currentRecord}>
                                <div class="slds-m-top_xx-small"><strong>Processing:</strong></div>
                                <div>
                                    <dl class="slds-dl_horizontal content">
                                        <dt class="slds-dl_horizontal__label slds-text-color_weak slds-m-bottom_xx-small">Name:</dt>
                                        <dd class="slds-dl_horizontal__detail  slds-m-bottom_xx-small">
                                            <c-slwc-lightning-formatted-url
                                                record={runAllModalData.currentRecord}
                                            ></c-slwc-lightning-formatted-url>
                                        </dd>
                                        <dt class="slds-dl_horizontal__label slds-text-color_weak slds-m-bottom_xx-small">Drive Name:</dt>
                                        <dd class="slds-dl_horizontal__detail  slds-m-bottom_xx-small">
                                            <c-slwc-lightning-formatted-url
                                                record={runAllModalData.currentRecord}
                                                label-field="driveName"
                                                id-field="driveId"
                                            ></c-slwc-lightning-formatted-url>
                                        </dd>
                                        <dt class="slds-dl_horizontal__label slds-text-color_weak slds-m-bottom_xx-small">Drive Date:</dt>
                                        <dd class="slds-dl_horizontal__detail  slds-m-bottom_xx-small">
                                            <lightning-formatted-date-time value={runAllModalData.currentRecord.driveDate} year="numeric" month="numeric" day="numeric" time-zone='GMT'></lightning-formatted-date-time>
                                        </dd>
                                    </dl>
                                </div>
                            </template>
                        </div>
                        <div if:true={runAllModalData.finishedAll}>
                            <c-slwc-custom-datatable 
                                key-field="id"  
                                data={runAllModalData.processedRecords}
                                columns={RUN_ALL_RESULT_TABLE_COLUMNS}
                                hide-checkbox-column
                                wrap-text-max-lines="3">
                            </c-slwc-custom-datatable>
                        </div>
                        <div if:true={runAllModalData.currentRecordId}>
                            <c-slwc-generate-drive-modal
                                no-action
                                embeded-mode
                                record-id={runAllModalData.currentRecordId}
                                mode="listenOpportunityChanged"
                                hook-after-finished={afterFinishGenerateDriveModalHook}
                            ></c-slwc-generate-drive-modal>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" if:true={runAllModalData.isOpen}></div>
    </template>

    <template if:false={runAllModalData.isOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open" if:true={generateDriveModalData.isOpen}>
            <div class="slds-modal__container" style="transform: initial; min-width: 40rem; width: 40rem;">
                <c-slwc-generate-drive-modal
                    no-action
                    record-id={generateDriveModalData.recordId}
                    mode="listenOpportunityChanged"
                    onclosemodal={closeGenerateDriveModal}
                ></c-slwc-generate-drive-modal>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" if:true={generateDriveModalData.isOpen}></div>
    </template>
</template>
