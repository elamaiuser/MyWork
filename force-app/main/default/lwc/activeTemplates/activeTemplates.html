<template >
    <div>
        <template if:true={showModal}>
            <div class="slds-m-around_medium">
                <div class="slds-text-align_center slds-m-bottom_medium">
                    <h1 class="slds-text-heading_medium"><strong>Active Templates</strong></h1>
                </div>
        
                <template if:true={opportunities}>
                    <div class="slds-text-align_left slds-m-bottom_medium">
                        Please select at least one or more templates to update the drive keyword for those templates and their corresponding future drives to :  <strong>{sponsorKeyword}</strong>
                    </div>
                    
                    <lightning-datatable
                        key-field="id"
                        data={opportunities}
                        columns={columns}
                        onrowselection={handleRowSelection}>
                    </lightning-datatable>
                    
                    <div class="slds-grid slds-grid_align-end slds-m-top_medium">
                        <lightning-button 
                            label="Update" 
                            onclick={applyToFutureDrives} 
                            class="slds-m-top_small">
                        </lightning-button>
                    </div>
                </template>
        
                <template if:true={error}>
                    <p>An error occurred: {error}</p>
                </template>
            </div>
        </template>
    </div>
</template>
