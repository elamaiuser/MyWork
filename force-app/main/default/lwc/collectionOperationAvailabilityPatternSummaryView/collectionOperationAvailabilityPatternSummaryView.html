<template>
    <template if:true={showSpinner}>
        <lightning-spinner class="spins" size="medium"></lightning-spinner>
    </template>

    <div class="slds-m-around_medium">
        <table class="grand-total-center-container slds-table slds-table_cell-buffer">
            <thead>
                <tr>
                    <th colspan="4" class="grand-total-header-main">
                        Grand Total
                    </th>
                </tr>
                <tr>
                    <th></th>
                    <th>Available</th>
                    <th>Needed</th>
                    <th>Variance</th>
                </tr>
            </thead>
            <tbody>
                <template for:each={model.colOpGrandTotalModels} for:item="colOpModel">
                    <tr key={colOpModel.id}>
                        <th>{colOpModel.typeOfStaff}</th>
                        <td>{colOpModel.grandTotalAvailable}</td>
                        <td>{colOpModel.grandTotalNeeded}</td>
                        <td class={colOpModel.varianceClass}>{colOpModel.variance}</td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
    <div class="availability-pattern-role-table-container">
        <template for:each={model.collectionOperationAvailabilities} for:item="colOpAvailability">
            <table key={colOpAvailability.id} class="slds-table slds-table_cell-buffer">
                <thead>
                    <tr>
                        <th colspan="4" class="availability-pattern-header">
                            {colOpAvailability.availabilityPatternName}
                        </th>
                    </tr>
                    <tr>
                        <th></th>
                        <th>Total Actual Resources (AP)</th>
                        <th>Total Target (AP)</th>
                        <th>Variance</th>
                    </tr>
                    <template for:each={colOpAvailability.totalApModels} for:item="coApModel">
                        <tr key={colOpAvailability.id}>
                            <td>{coApModel.typeOfStaff}</td>
                            <td>{coApModel.totalActualResources}</td>
                            <td>{coApModel.totalTargetResources}</td>
                            <td class={coApModel.totalVarianceClass}>{coApModel.totalVariance}</td>
                        </tr>
                    </template>
                    <tr class="ap-divider-row">
                        <td colspan="4"></td>
                    </tr>

                    <tr>
                        <th>Roles</th>
                        <th>Actual</th>
                        <th>Minimum</th>
                        <th>Variance</th>
                    </tr>
                </thead>
                <tbody>
                    
                    <template for:each={colOpAvailability.availabilityPatternRoles} for:item="availabilityPatternRole">
                        <tr key={availabilityPatternRole.id}>
                            <th>{availabilityPatternRole.role}</th>
                            <td>{availabilityPatternRole.actualCountOfRoles}</td>
                            <td>{availabilityPatternRole.minNumberOfRoles}</td>
                            <td class={availabilityPatternRole.varianceClass}>{availabilityPatternRole.variance}</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>
    </div>
</template>
