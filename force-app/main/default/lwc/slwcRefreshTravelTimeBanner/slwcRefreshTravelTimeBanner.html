<template>
    <div if:true={isNotUserOverrideChecked}>
        <div if:true={showTravelTimeBanner} class={bannerClass} role="alert">
            <div class="slds-media__figure">
                <span class="slds-icon_container">
                    <lightning-icon class="slds-current-color" icon-name={iconName} size="x-small"></lightning-icon>
                </span>
            </div>
            <h2 class="slds-grid">
                {bannerContent}
                <a if:true={showLink} onclick={initiateManualRefresh} class="slds-var-p-left_xx-small">{linkContent}</a>
            </h2>
        </div>
    </div>
</template>
