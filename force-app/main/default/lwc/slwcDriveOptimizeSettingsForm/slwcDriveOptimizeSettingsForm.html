<template>
    <div class="slds-grid">
        <div class="slds-size_4-of-12 slds-p-horizontal_small">
            <article class="slds-card">
                <div class="slds-card__header slds-grid">
                    <header class="slds-media slds-media_center slds-has-flexi-truncate">
                        <div class="slds-media__body">
                            <h2 class="slds-card__header-title">
                                <a href="javascript:void(0);" class="slds-card__header-link slds-truncate">
                                    <span>Scoring Factors</span>
                                </a>
                            </h2>
                        </div>
                        <div class="slds-no-flex">
                            <lightning-button label="Reset" onclick={handleResetScoringFactors} variant="neutral"></lightning-button>
                        </div>
                    </header>
                </div>
                <div class="slds-card__body slds-card__body_inner">
                    <template for:each={softConstraints} for:item="setting">
                        <div key={setting.constraint} class="slds-m-bottom_small slds-grid slds-grid_vertical-align-center">
                            <div class="slds-size_4-of-12">
                                <label class="slds-form-element__label">{setting.constraint}</label>
                            </div>
                            <div class="slds-size_8-of-12">
                                <c-slwc-optimizer-constraint-input
                                    setting-record={setting}
                                    disabled={isReadonly}
                                    onvaluechange={handleOnChange}
                                ></c-slwc-optimizer-constraint-input>
                            </div>
                        </div>
                    </template>
                </div>
            </article>
        </div>
    </div>
</template>
