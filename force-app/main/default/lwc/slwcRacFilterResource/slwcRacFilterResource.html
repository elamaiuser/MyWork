<template>
    <c-slwc-click-outside func={closeFilterPopover}>
        <div class="slds-form-element bco-select slds-lookup">
            <div class="slds-button-group slds-form-element__control button-group sked-pagin-group">
                <div class="slds-form-element width-100">
                    <div class="slds-form-element__control">
                        <div>
                            <lightning-input type="search" onchange={handleSearchText} value={clonedFilterPopverState.queryText}
                                max-length="255" label="Filter by Resource Name" variant="label-hidden"
                                placeholder="Filter by Resource Name" class="search-textbox"></lightning-input>
                        </div>
                    </div>
                </div>
                <button onclick={openFilterPopover}
                    class="slds-button slds-button_icon bco-select__filter-manager-trigger slds-m-left_xx-small">
                    <lightning-icon class="slds-button__icon slds-current-color" style={filterButtonClass} icon-name="utility:filterList"
                        size="x-small"></lightning-icon>
                    <span class="slds-assistive-text">Resources Filter</span>
                </button>
            </div>
        </div>
    
        <section class={customClass.filterPopover} style={customStyle.filterPopover}>
            <button class="slds-button slds-modal__close slds-button_icon-inverse" title="Close"
                onclick={closeFilterPopover}>
                <lightning-icon class="slds-button__icon slds-button__icon_large" icon-name="utility:close"
                    variant="inverse" size="small"></lightning-icon>
                <span class="slds-assistive-text">Close</span>
            </button>
            <div class="slds-popover__header" style="padding: .75rem;">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                    <div>
                        <h2 class="slds-text-heading_medium slds-hyphenate">Resources Filter</h2>
                    </div>
                    <div class="slds-text-align_right">
                        <button class="slds-button slds-button_icon-border slds-button_icon-brand action-button"
                            onclick={applyFilter}>
                            <lightning-icon class="slds-button__icon" icon-name="utility:check" variant="inverse"
                                size="xx-small"></lightning-icon>
                        </button>
                    </div>
                </div>
            </div>
            <div class="slds-popover__body">
                <div class="slds-popover__body-list slds-form_compound">
                    <div class="slds-form-element__row">
                        <c-slwc-multi-picklist
                            class="slds-grow"
                            name="resource"
                            label="Resource Type"
                            pick-list-values={resourceTypesOption}
                            default-values={clonedFilterPopverState.selectedResourcesTag}
                            onpicklistchange={handleResourceTagChanged}>
                        </c-slwc-multi-picklist>
                    </div>
                    <div class="slds-form-element__row slds-m-top_x-small">
                        <c-slwc-multi-picklist
                            class="slds-grow"
                            name="resource"
                            label="Resource Tag"
                            pick-list-values={resourceTagsOption}
                            default-values={clonedFilterPopverState.selectedResourcesTag}
                            onpicklistchange={handleResourceTagChanged}>
                        </c-slwc-multi-picklist>
                    </div>
                    <div class="slds-form-element__row slds-m-top_x-small">
                        <c-slwc-multi-picklist
                            class="slds-grow"
                            name="resource"
                            label="Availability Template"
                            pick-list-values={resourceTagsOption}
                            default-values={clonedFilterPopverState.selectedResourcesTag}
                            onpicklistchange={handleResourceTagChanged}>
                        </c-slwc-multi-picklist>
                    </div>
                </div>
            </div>
        </section>
        <div class={customClass.filterPopoverBackdrop}></div>
    </c-slwc-click-outside>
</template>
