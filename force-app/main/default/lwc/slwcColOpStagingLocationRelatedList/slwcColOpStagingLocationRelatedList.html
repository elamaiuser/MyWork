<template>
    <div class="slds-border_top slds-border_right slds-border_bottom slds-border_left">
        <div class="slds-page-header">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="custom:custom47" size="small"
                                alternative-text="Custom Icon"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                    <h2 class="slds-card__header-title">{relatedListHeader}</h2>
                                </div>
                            </div>
                        </div>
                    </div>        
                </div>
                <lightning-button label="New" slot="actions" onclick={handleCreateCollectionOperationStagingLocation}></lightning-button>
                <div class="slds-p-left_small">
                    <lightning-button-icon tooltip="Refresh" onclick={handleRefresh}
                        icon-name="utility:refresh"></lightning-button-icon>
                </div>
            </div>
        </div>
    
        <c-slwc-collection-operation-staging-location-table 
            record-id={recordId}
            records={records} 
            onshowdatatable={handleShowDataTable}
            onsave={handleSaveBtn}
            ondatachange={handleDataChangeAfterEditOrDelete}
            is-disable-required={isDisableRequired}
            is-data-present={isDataPresent}>
        </c-slwc-collection-operation-staging-location-table>
    
        <c-slwc-add-col-op-staging-location-modal
            record-id={recordId} 
            if:true={addColOpStagingLocationModal.isOpen}
            is-open={addColOpStagingLocationModal.isOpen}
            is-delete-modal={addColOpStagingLocationModal.isDeleteModal}
            collection-operation-name={collectionOperationName}         
            action={addColOpStagingLocationModal.action}
            onclose={handleCloseColOpStagingLocationModal}
            onmodaldatachange={handleTableDataAfterCreation}>
        </c-slwc-add-col-op-staging-location-modal>
    
    </div>
</template>
