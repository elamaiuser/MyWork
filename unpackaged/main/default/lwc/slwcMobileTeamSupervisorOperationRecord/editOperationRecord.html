<template>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
        <lightning-spinner if:true={showSpinner} class="spins" size="medium"></lightning-spinner>

        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <div style="width: 3rem">
                    <lightning-button-icon icon-name="utility:chevronleft" variant="bare-inverse" alternative-text="Back" title="Back" size="large" onclick={handleBack}></lightning-button-icon>
                </div>

                <h2 class="slds-text-heading_medium slds-hyphenate">Edit Operation Record</h2>

                <div style="width: 3rem">
                </div>
            </header>
            <div class="slds-modal__content slds-is-relative slds-p-around_medium">
                <template if:true={operationRecordModalData.isOpen}>
                    <c-slwc-operation-record
                        job={operationRecordModalData.job}
                        job-allocation={operationRecordModalData.jobAllocation}
                        no-readonly-mode
                        full-screen
                        is-open={operationRecordModalData.isOpen}
                        onclose={handleCloseOperationRecordModal}
                    ></c-slwc-operation-record>
                </template>
            </div>
        </div>
    </section>
</template>
