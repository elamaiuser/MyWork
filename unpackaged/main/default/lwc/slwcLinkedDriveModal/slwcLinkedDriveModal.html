<template>
    <section role="dialog" tabindex="-1" class={customClass.modalClass}>
        <div class="slds-modal__container" style="max-width: 80rem; transform: initial;">
            <header class={customClass.headerClass}>
                <lightning-button-icon onclick={handleCancel} class="slds-button slds-button_icon slds-modal__close" size="large"
                    icon-name="utility:close" variant="bare-inverse" title="Close"></lightning-button-icon>

                <h2 class="slds-modal__title slds-hyphenate">Linked Drives</h2>
            </header>
            <div class="slds-modal__content slds-is-relative">
                <template if:true={drive}>
                    <c-slwc-linked-drives 
                        drive={drive}
                        read-only={readOnly}
                        can-delete
                    ></c-slwc-linked-drives>
                </template>
            </div>
            <footer class={customClass.footerClass}>
                <button class="slds-button slds-button_neutral" onclick={handleCancel}>Close</button>
            </footer>
        </div>
    </section>
    <div class={customClass.backdropClass}></div>
</template>
