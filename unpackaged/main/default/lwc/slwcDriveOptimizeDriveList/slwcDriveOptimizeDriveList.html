<template>
    <div class="slds-grid">
        <div class="slds-col slds-scrollable_y slds-is-relative" style="min-height: 400px; width:100%;">
            <div class="slds-grid">
                <template if:true={optimizationEnabled}>
                    <div class="slds-grow slds-grid slds-grid_vertical" style="justify-content: flex-end;">
                        <div  if:true={hasExistingOptimizationRun} class="slds-grid slds-text-color_error slds-p-horizontal_medium">
                            <lightning-icon class="slds-current-color slds-m-right_x-small" icon-name="utility:warning" size="x-small" alternative-text="Warning!" title="Warning"></lightning-icon>
                            <h2>
                                There is an in progress optimization run
                            </h2>
                        </div>
                        <h2 class="slds-text-title_caps slds-text-color-weak sub-header slds-m-bottom_small">Optimization Status</h2>
                    </div>
                </template>
                <div class="slds-col_bump-left slds-p-right_small">
                    <div class="slds-grid">
                        <div class="slds-p-right_small">
                            <c-slwc-multi-picklist
                                class="slds-m-right_medium"
                                name="driveTypes"
                                label="Drive Types"
                                object-api-name="sked_Drive__c"
                                field-api-name='sked_Type_of_Drive__c'
                                onpicklistchange={handleOnChange}
                                default-values={filters.driveTypes}>
                            </c-slwc-multi-picklist>
                        </div>
                        <div class="slds-p-right_small" style="width: 300px;">
                            <c-slwc-new-collection-operation-multi-picklist
                                division-single-select
                                date-range={collectionOperationDateRange}
                                default-values={filters.collectionOperationValues}
                                onchange={handleCollectionOperationChanged}>
                            </c-slwc-new-collection-operation-multi-picklist>
                        </div>
                        <div class="slds-p-right_small">
                            <c-slwc-week-date-picker
                                first-day={collectionOperationFirstDay}
                                unique-key="driveOptimizer"
                                onweekdatechange={handleOnChange}
                                default-start-date={filters.startDate}
                                default-end-date={filters.endDate}>
                            </c-slwc-week-date-picker>
                        </div>
                    </div>
                </div>
            </div>

            <div class="slds-p-around_small slds-is-relative">
                <template if:true={showSpinner}>
                    <lightning-spinner class="spins" size="medium"></lightning-spinner>
                </template>

                <template if:false={optimizationEnabled}>
                    <div class="slds-align_absolute-center slds-p-around_small">
                        <lightning-icon icon-name="utility:warning" size="x-small" alternative-text="Warning!" title="Warning" class="slds-m-right_xx-small"></lightning-icon>
                        <span>Please select collection operations in 1 ARC Region only to use Optimize.</span>
                    </div>
                </template>

                <template if:true={optimizationEnabled}>
                    <div class="slds-grow">
                        <div class="slds-grid slds-border_bottom">
                            <template for:each={statusGroups} for:item="group">
                                <div key={group.status} class={group.class} data-value={group.status} onclick={handleFilterDrives}>
                                    <div>{group.status}</div>
                                    <div class={group.countClass}>{group.totalDrives}</div>
                                </div> 
                            </template>
                            <div class="slds-grid slds-grid_vertical-align-center slds-p-bottom_x-small slds-p-left_x-small">
                                <lightning-button-icon tooltip="Refresh" icon-name="utility:refresh" onclick={handleRefresh}></lightning-button-icon>
                            </div>
                            <div class="slds-grid slds-grid_vertical-align-center slds-col_bump-left">
                                <!-- <div class="slds-text-color_weak slds-m-right_x-small">
                                    <div>
                                        Optimize: <strong>{selectedDriveIds.length}</strong> drive(s) selected
                                    </div>
                                </div> -->
                                <lightning-button class="slds-m-right_small" label={btnDispatchLabel} variant="brand" onclick={showDispatchDriveModal} disabled={btnDispatchDisabled}></lightning-button>
                                <lightning-button label={btnOptimizeLabel} variant="brand" onclick={showOptimizeConfirmModal} disabled={btnOptimizeDisabled}></lightning-button>
                            </div>
                        </div>
                        <div class="slds-scrollable" style="max-height: 60vh; width: calc(100vw - 5rem);">
                            <c-slwc-custom-datatable 
                                key-field="id"
                                data={filteredList}
                                columns={columns}
                                onrowaction={handleRowAction}
                                hide-checkbox-column={hideCheckboxColumn}
                                selected-rows={selectedDriveIds}
                                onrowselection={handleRowSelection}
                                wrap-text-max-lines="3">
                            </c-slwc-custom-datatable>
                        </div>
                        <div class="slds-shrink-none slds-grow-none slds-p-horizontal_small slds-p-vertical_small slds-border_top modal-content__footer">
                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center"> 
                                <div class="slds-text-color_weak">Total drives: {totalDrives} </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
    
    <c-slwc-dispatch-drive-modal
        drives={dispatchDriveModalData.drives}
        is-open={dispatchDriveModalData.isOpen}
        onclose={hideDispatchDriveModal}>
    </c-slwc-dispatch-drive-modal>
    <c-slwc-drive-optimize-confirm-modal
        is-open={optimizeConfirmModalData.isOpen}
        drives={optimizeConfirmModalData.drives}
        collection-operation-id={optimizeConfirmModalData.collectionOperationId}
        start-date={filters.startDate}
        end-date={filters.endDate}
        handle-on-close={optimizeConfirmModalData.onClose}>
    </c-slwc-drive-optimize-confirm-modal>
    <c-slwc-drive-staffing-details
        scheduling-console-territory-keys={territoryKeys}
        optimization-queue={optimizationQueue}
        is-open={driveSideMenuData.shown}
        record-id={driveSideMenuData.recordId}
        onclose={closeDriveSideMenu}
        onsave={saveDriveSideMenu}>
    </c-slwc-drive-staffing-details>
    <c-slwc-linked-drive-modal
        drive={linkedDriveModalData.drive}
        is-open={linkedDriveModalData.shown}
        onclose={closeLinkedDriveModal}
    >
    </c-slwc-linked-drive-modal>
</template>
