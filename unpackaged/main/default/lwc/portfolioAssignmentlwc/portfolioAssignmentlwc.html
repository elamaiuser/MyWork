<template>
    <lightning-card>
        <div style="padding-left: 15px;">
            <div style="padding-left: 30px;">
                <div style="padding-left: 45px;">
                    <div style="padding-left: 45px;">
                        <div>
                            <template if:true={iserrormsg}>
                                <div> <p style="color: red;
                                                font-weight: 600;
                                                font-size: 1.2em;"> {errorMessageText} 
                                        </p> 
                                </div>
                            </template>
                    
                        </div>
                        <div class="spinner">
                            <template if:true={isLoading}>

                                 <lightning-spinner alternative-text="Loading" variant="brand" size="large">
                                 </lightning-spinner>
                            </template>
                        </div>

                        <div>
                            <template if:true={isSuccessmsg}>
                                <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                                    <div class="slds-modal__container">
                                        <!-- Modal/Popup Box LWC header here -->
                                        <header class="slds-modal__header">
                                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                                                <lightning-icon icon-name="utility:close"
                                                    alternative-text="close"
                                                    variant="inverse"
                                                    size="small" ></lightning-icon>
                                                <span class="slds-assistive-text">Close</span>
                                            </button>
                                            <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate" style="color:green">Success</h2>
                                        </header>
                                        <!-- Modal/Popup Box LWC body starts here -->
                                        <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                                            <p><b>The Accountportfolio assignments are successfully processed
                                            </b></p>
                                         </div>
                                         <!--<footer class="slds-modal__footer">
                                            <button class="slds-button slds-button_neutral"  onclick={closeModal} title="ok">ok</button>
                                            
                                        </footer>-->
                                      </div>
                                      
                                </section>
                                <div class="slds-backdrop slds-backdrop_open"></div>




                            </template>

                        </div>
                        
                        
                        <div id="parentContainerId" style="display: flex;">
                            <div style="padding: 10px;">
                                <div style="padding-top: 10px;">
                                    <div style="padding-top: 10px;padding-left: 20px;height: 400px;overflow: scroll;border: 2px solid;box-shadow: 10px 10px 5px grey;">
                                        <div style="padding-left: 15px;"> 
                                            <p style="font-weight: 700;"> Selected Accounts </p> 
                                        </div>
                                        <template for:each={accountObjects} for:item="acc">
                                            <span key={acc.account_id}>
                                                <c-open-account-detailcmp accobject={acc}></c-open-account-detailcmp>
                                            </span>                                            
                                        </template>
                                    </div>
                                </div>
                            </div>
                            
                            <div style="padding: 10px;">
                                <div>
                                    <div>
                                        <lightning-layout vertical-align="start">
                                            <lightning-layout-item padding="around-small">
                                                <div class="header-column">
                                                <lightning-combobox
                                                    name="portfolioTypes"
                                                    label="Portfolio Types"
                                                    value={portfolioType}
                                                    placeholder=""
                                                    options={portfolioTypeoptions}
                                                    onchange={portfolioTypeChange}
                                                    required="true"></lightning-combobox>
                                               </div>
                                            </lightning-layout-item>


                                            <lightning-layout-item padding="around-small">
                                                <div class="header-column">
                                                    <lightning-combobox
                                                        name="accportfolio"
                                                        label="Non Geographic Portfolio"
                                                        value={accportfoliovalue}
                                                        placeholder=""
                                                        options={portfoliooptions}
                                                        onchange={portfolioChange}
                                                        required="true"></lightning-combobox>
                                        
                                                </div>
                                            </lightning-layout-item>
                                            <lightning-layout-item padding="around-small">
                                                <div class="header-column">
                                                    <lightning-input type="date" name="startdate" class="portfoliostartdate" label="Start Date" 
                                                                        value={accountPortfolioWrapperobj.Start_Date}
                                                                        onchange={StartDateChange}
                                                                        required="true"></lightning-input>  
                                                </div>                                
                                            </lightning-layout-item>
                                            <lightning-layout-item flexibility="auto" padding="around-small">
                                                <div class="header-column">
                                                    <lightning-input type="date" name="enddate" class="portfolioenddate" label="End Date" 
                                                                        required="true"
                                                                        value={accountPortfolioWrapperobj.End_Date}></lightning-input>  
                                                </div>
                                            </lightning-layout-item> 
                                            
                                                
                                               

                                            <lightning-layout-item padding="around-small">
                                                <div style="margin-top:15px;">
                                                    <div style="margin-top:15px;">
                                                        <div style="padding-top:7px;">
                                                            <lightning-button variant="brand" label="Save" title="saveportfolio" onclick={onsaveclick} class="slds-m-left_x-small"></lightning-button>
                                                        </div>
                                                    </div>
                                                    
                                                </div>
                                            </lightning-layout-item> 
                                            <lightning-layout-item padding="around-small">
                                                <div style="margin-top:15px;">
                                                    <div style="margin-top:15px;">
                                                        <div style="padding-top:7px;">
                                                            <lightning-button variant="brand" label="Back" title="backportfolio" onclick={onbackclick} class="slds-m-left_x-small"></lightning-button>
                                                        </div>
                                                    </div>

                                                   

                                                </div>
                                            </lightning-layout-item>                                              
                                        </lightning-layout>
                                    
                                        <div style="padding-right: 400px; padding-bottom: 400px ; padding-top: 15px; padding-left:5px;" >
                                            
                                            <template if:true={acccountBasedReasonPicklist.data}>
                                                
                                                <lightning-dual-listbox 
                                                   name="AccountBasedReason"
                                                   label="Account Based Reason"
                                                   source-label="Available" 
                                                   selected-label="Selected"
                                                   onchange={AccountBasedReasonChange}
                                                   options={acccountBasedReasonPicklist.data.values}
                                                   required="true"
                                                   size="3">
                                                   
                                                   
                                                </lightning-dual-listbox>
                                            
                                            </template>
                                            
                                        </div>
                                    
                                    </div>
                                </div>
                            </div>
                        </div>

                        
                    </div>
                </div>
            </div>
        </div>

    </lightning-card>
</template>
