<template>
    <section role="dialog" tabindex="-1" class={customClass.modalClass} style={customStyle.modalStyle}>
        <div class="slds-modal__container" style={customStyle.modalContainer} if:true={isOpen}>
            <header class={customClass.headerClass}>
                <lightning-button-icon onclick={handleCancel} class="slds-button slds-button_icon slds-modal__close"
                    size="large" icon-name="utility:close" variant="bare-inverse" title="Close"></lightning-button-icon>

                <h2 class="slds-modal__title slds-hyphenate">Acknowledge Shift Trade</h2>
            </header>
            <div class="slds-modal__content slds-is-relative" style="overflow: initial;">
                <lightning-spinner if:true={showSpinner} class="spins" size="medium"></lightning-spinner>

                <div class="slds-p-horizontal_medium slds-p-vertical_small">
                    <p>
                        Do you want to acknowledge this shift trade?
                    </p>

                    <div class="slds-form_compound slds-m-top_small">
                        <div class="slds-p-vertical--x-small" if:true={isTATAcknowledgeRequired}>
                            <lightning-input type="checkbox" name="staffTATAcknowledge"
                                label="You acknowledge this trade may result in not receiving a TAT violation payment. Please see your scheduler/timekeeper for more information." required
                                value={model.staffTATAcknowledge} checked={model.staffTATAcknowledge} onchange={handleOnChangeModel}>
                            </lightning-input>
                        </div>
                        <div class="slds-p-vertical--x-small" if:true={isGMHAcknowledgeRequired}>
                            <lightning-input type="checkbox" name="staffGMHAcknowledge"
                                label="You acknowledge this trade may result in not receiving a guaranteed minimum time payment. Please see your scheduler/timekeeper for more information." required
                                value={model.staffGMHAcknowledge} checked={model.staffGMHAcknowledge} onchange={handleOnChangeModel}>
                            </lightning-input>
                        </div>
                        <div class="slds-p-vertical--x-small" if:true={isRelocatedAcknowledgeRequired}>
                            <lightning-input type="checkbox" name="staffRelocatedAcknowledge"
                                label="You acknowledge you are relocated for this trade. Please see your scheduler/timekeeper for more information." required
                                value={model.staffRelocatedAcknowledge} checked={model.staffRelocatedAcknowledge} onchange={handleOnChangeModel}>
                            </lightning-input>
                        </div>
                        <div class="slds-p-vertical--x-small" if:true={UnavailableForCOAcknowledgeRequired}>
                            <lightning-input type="checkbox" name="staffUnavailableForCOAcknowledge"
                                label="You acknowledge you are not available for the collection operation in this trade. Please see your scheduler/timekeeper for more information." required
                                value={model.staffUnavailableForCOAcknowledge} checked={model.staffUnavailableForCOAcknowledge} onchange={handleOnChangeModel}>
                            </lightning-input>
                        </div>
                    </div>
                </div>
            </div>
            <footer class={customClass.footerClass}>
                <button class="slds-button slds-button_neutral" onclick={handleCancel}>No</button>
                <button class="slds-button slds-button_brand" disabled={btnConfirmDisabled} onclick={handleConfirm}>Yes</button>
            </footer>
        </div>
    </section>
    <div class={customClass.backdropClass} style={customStyle.backdropStyle}></div>
</template>
