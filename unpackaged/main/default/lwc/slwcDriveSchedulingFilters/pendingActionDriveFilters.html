<template>
    <c-slwc-click-outside func={closePanel}>
        <nav class={customClass.panel}>
            <div class="toggle-button" onclick={togglePanel}>
                <lightning-button-icon class="arrow-icon" icon-name="utility:chevronleft" size="large" if:true={isOpen} variant="bare" tooltip="Collapse"></lightning-button-icon>
                <lightning-button-icon class="arrow-icon" icon-name="utility:chevronright" size="large" if:false={isOpen} variant="bare" tooltip="Expand"></lightning-button-icon>
            </div>

            <div class="slds-nav-vertical__section">
                <h2 class="slds-nav-vertical__title slds-p-horizontal_small">Filters</h2>
                <ul>
                    <li class="slds-p-right_small slds-p-left_xx-small">
                        <div class="slds-form-element slds-form-element_stacked">
                            <c-slwc-multi-picklist
                                name="driveTypes"
                                label="Drive Types"
                                selected-by-default={selectedAllByDefault}
                                object-api-name="sked_Drive__c"
                                field-api-name="sked_Type_of_Drive__c"
                                onpicklistchange={handleOnChange}
                                default-values={filters.driveTypes}>
                            </c-slwc-multi-picklist>                   
                        </div>
                        <div class="slds-form-element slds-form-element_stacked">
                            <c-slwc-multi-picklist
                                name="pendingActions"
                                label="Pending Actions"
                                selected-by-default={selectedAllByDefault}
                                object-api-name="sked_Drive__c"
                                field-api-name="sked_Pending_Action__c"
                                onpicklistchange={handleOnChange}
                                default-values={filters.pendingActions}
                                excluded-values={filters.excludedPendingActions}
                            >
                            </c-slwc-multi-picklist>                   
                        </div>
                        <div class="slds-form-element slds-form-element_stacked">
                            <c-slwc-multi-picklist
                                name="approvalStatuses"
                                label="Approval Statuses"
                                selected-by-default={selectedAllByDefault}
                                object-api-name="sked_Drive__c"
                                field-api-name="sked_Approval_Status__c"
                                onpicklistchange={handleOnChange}
                                default-values={filters.approvalStatuses}>
                            </c-slwc-multi-picklist>
                        </div>
                        <div class="slds-form-element slds-form-element_stacked">
                            <c-slwc-multi-lookup
                                name="accountManagerPortfolios"
                                label="Account Manager Portfolio"
                                display-subline-field="description"
                                selection={filters.accountManagerPortfolios}
                                is-custom-search 
                                custom-search-func={handleSearchBsfPortfolioOnDrive}
                                onselectionchange={handleOnChange}
                                placeholder="Search Account Manager Portfolio">
                            </c-slwc-multi-lookup> 
                        </div>
                        <div class="slds-form-element slds-form-element_stacked">
                            <c-slwc-multi-lookup
                                name="districtManagerPortfolios"
                                label="District Manager Portfolio"
                                display-subline-field="description"
                                selection={filters.districtManagerPortfolios}
                                is-custom-search 
                                custom-search-func={handleSearchBsfPortfolioOnDrive}
                                onselectionchange={handleOnChange}
                                placeholder="Search District Manager Portfolio">
                            </c-slwc-multi-lookup> 
                        </div>
                        <div class="slds-form-element slds-form-element_stacked slds-m-top_medium slds-text-align_right">
                            <lightning-button label="Save" title="Save" variant="brand" onclick={handleSearch}></lightning-button>
                        </div>
                    </li>
                </ul>
            </div>
        </nav>
    </c-slwc-click-outside>
</template>
