<template>
    <lightning-card title = "My Prospect Drives" icon-name="custom:custom17">
        <lightning-button label="Convert" slot="actions"></lightning-button>
        <template if:true={showDrives}>
            <lightning-datatable              
                     key-field="driveId"
                     data={drives}
                     columns={columns}
                     show-row-number-column="true"
                     max-row-selection="10"
                     onrowselection={showOpportunity}>
            </lightning-datatable>
        </template>
        <template if:false={showDrives}>
            <b>No Drives found</b>
        </template>
        <template if:true={showSpinner}>
            <lightning-spinner
                alternative-text='Loading Drives'>
            </lightning-spinner>
        </template>
    </lightning-card>
</template>
