                    <div class="slds-media">
                        <div class="slds-media__figure">

                            <lightning-icon icon-name="standard:event"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <p class="slds-page-header__name-meta">Drive Date Selection</p>
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                    <h1>
                                        <span class="slds-page-header__title slds-truncate">{celendarHeader}</span>
                                    </h1>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div if:true={isMobile}>
                    <div class="slds-grid  slds-grid_vertical-align-end">
                        <div class="slds-col slds-size--5-of-6 slds-m-right_x-small">
                            <c-slwc-month-picker 
                                unique-key="planDrive" 
                                label="Selected Month"
                                onmonthchange={handleOnMonthChanged}
                                default-value={filter.selectedMonth}>
                            </c-slwc-month-picker>
                        </div>
                        <div class="slds-col slds-size--1-of-6">
                            <lightning-button-icon tooltip="Refresh" variant="border-filled" onclick={forceRefresh} icon-name="utility:refresh"></lightning-button-icon>
                        </div>
                    </div>
                </div>
                <div if:false={isMobile} class="slds-no-flex slds-grid slds-grid_vertical-align-end">
                    <div class="slds-form-element slds-m-right_x-small">
                        <c-slwc-month-picker 
                            unique-key="planDrive" 
                            label="Selected Month"
                            onmonthchange={handleOnMonthChanged}
                            default-value={filter.selectedMonth}>
                        </c-slwc-month-picker>
                    </div>
                    <div class="slds-col">
                        <lightning-button-icon tooltip="Refresh" variant="border-filled" onclick={forceRefresh} icon-name="utility:refresh"></lightning-button-icon>
                    </div>
                </div>
            </div>
        </div>

        <template if:true={isMobile}>
            <div class="slds-grid" if:true={initialized}>
                <div class="slds-no-flex" >
                    <c-slwc-plan-drive-calendar
                        opportunity={opportunity}
                        master-data={masterData}
                        default-date={driveDate}
                        onselectdate={handleSelectDate}
                        selected-month={filter.selectedMonth}></c-slwc-plan-drive-calendar>
                </div>
            </div>
        </template>
        <template if:true={isDesktop}>
            <div class="slds-grid" if:true={initialized}>
                <div class="slds-grow">
                    <c-slwc-plan-drive-booking-grid
                        opportunity={opportunity}
                        master-data={masterData}
                        default-date={driveDate}
                        onselectdate={handleSelectDate}
                        selected-month={filter.selectedMonth}></c-slwc-plan-drive-booking-grid>
                </div>
                <div class="slds-no-flex" style="width: 20rem;">
                    <c-slwc-plan-drive-calendar
                        opportunity={opportunity}
                        master-data={masterData}
                        default-date={driveDate}
                        onselectdate={handleSelectDate}
                        selected-month={nextMonth}></c-slwc-plan-drive-calendar>
                    
                    <c-slwc-plan-drive-calendar
                        opportunity={opportunity}
                        master-data={masterData}
                        default-date={driveDate}
                        onselectdate={handleSelectDate}
                        selected-month={next2Month}></c-slwc-plan-drive-calendar>
                </div>
            </div>
        </template>
        <template if:true={isTablet}>
            <div if:true={initialized}>
                <div class="slds-grow">
                    <c-slwc-plan-drive-booking-grid
                        opportunity={opportunity}
                        master-data={masterData}
                        default-date={driveDate}
                        onselectdate={handleSelectDate}
                        selected-month={filter.selectedMonth}></c-slwc-plan-drive-booking-grid>
                </div>
                <div class="slds-grid">
                    <div class="slds-col slds-size--1-of-2 slds-align_absolute-center">
                        <c-slwc-plan-drive-calendar
                        opportunity={opportunity}
                        master-data={masterData}
                        default-date={driveDate}
                        onselectdate={handleSelectDate}
                        selected-month={nextMonth}></c-slwc-plan-drive-calendar>
                    </div>
                    <div class="slds-col slds-size--1-of-2 slds-align_absolute-center">
                        <c-slwc-plan-drive-calendar
                        opportunity={opportunity}
                        master-data={masterData}
                        default-date={driveDate}
                        onselectdate={handleSelectDate}
                        selected-month={next2Month}></c-slwc-plan-drive-calendar>
                    </div>
                </div>
            </div>
        </template>
    </article>

    <c-slwc-confirm-modal
        is-open={confirmModalData.isOpen}
        title={confirmModalData.title}
        mode={confirmModalData.mode}
        message={confirmModalData.message}
        confirm-btn-label={confirmModalData.confirmBtnLabel}
        cancel-btn-label={confirmModalData.cancelBtnLabel}
        handle-on-close={confirmModalData.onClose}
        size='x-small'
    ></c-slwc-confirm-modal>
</div>
</template>
