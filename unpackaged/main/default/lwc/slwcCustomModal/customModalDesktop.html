<template>
    <section style="z-index: 9999;" role="dialog" tabindex="-1"
                aria-labelledby="modal-heading-01"
                aria-modal="true"
                aria-describedby="modal-content-id-1"
                class={customClass.modal}>
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small" ></lightning-icon>
                </button>
                <h2 class="slds-modal__title slds-hyphenate slds-truncate">
                    {header}
                </h2>
            </header>

            <div class={customClass.content}>
                <slot name="content"></slot>
            </div>

            <footer class="slds-modal__footer">
                <lightning-button label={cancelBtnLabel} title={cancelBtnLabel} onclick={closeModal} class="slds-m-right_xx-small"></lightning-button>
                <lightning-button class="slds-m-top_small" onclick={handleSave} variant="brand" type="submit" name="update" disabled={disabledSave} label={saveBtnLabel}></lightning-button>
            </footer>
        </div>
    </section>
    <div style="z-index: 9998" class="slds-backdrop slds-backdrop_open"></div>
</template>
