<template>
    <lightning-spinner if:true={showSpinner} class="spins" size="medium"></lightning-spinner>
    
    <template if:true={initialized}>
        <ul class="slds-accordion">
            <li class="slds-accordion__list-item">
                <section class="slds-accordion__section slds-is-open">
                    <div class="slds-accordion__content">
                        <div class="slds-p-around_xx-small">
                            <lightning-input type="text" name="resourceRole" disabled label="Type (role)"
                                value={jobAllocation.job.resourceRole}></lightning-input>
                        </div>
                        <div class="slds-p-around_xx-small">
                            <lightning-input type="text" name="dualRole" disabled label="Dual Role"
                                value={jobAllocation.job.dualRole}></lightning-input>
                        </div>
                        <div class="slds-p-around_xx-small">
                            <lightning-textarea name="additionalRoles" disabled label="Additional Roles"
                                value={additionalRolesString}></lightning-textarea>
                        </div>
                        <div class="slds-p-around_xx-small">
                            <lightning-textarea name="address" disabled label="Address"
                                value={jobAllocation.job.address}></lightning-textarea>
                        </div>
                        <div class="slds-p-around_xx-small">
                            <lightning-textarea name="driveName" disabled label="Drive Name"
                                value={jobAllocation.driveName}></lightning-textarea>
                        </div>
                        <div class="slds-p-around_xx-small">
                            <lightning-input type="text" name="driveShiftName" disabled label="Drive Shift"
                                value={jobAllocation.driveShiftName}></lightning-input>
                        </div>
                        <div class="slds-p-around_xx-small">
                            <div class="slds-form-element slds-form-element_readonly">
                                <span class="slds-form-element__label">Start</span>
                                <div class="slds-form-element__control">
                                    <div class="slds-form-element__static slds-truncate">
                                        <lightning-formatted-date-time value={jobAllocation.start}
                                            year="numeric" month="numeric" day="numeric" hour="numeric" minute="2-digit"
                                            time-zone={timezoneSidId}></lightning-formatted-date-time>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="slds-p-around_xx-small">
                            <div class="slds-form-element slds-form-element_readonly">
                                <span class="slds-form-element__label">End</span>
                                <div class="slds-form-element__control">
                                    <div class="slds-form-element__static slds-truncate">
                                        <lightning-formatted-date-time value={jobAllocation.end}
                                            year="numeric" month="numeric" day="numeric" hour="numeric" minute="2-digit"
                                            time-zone={timezoneSidId}></lightning-formatted-date-time>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="slds-p-around_xx-small">
                            <lightning-input type="text" name="travelTimeTo" disabled label="Travel Time To"
                                value={jobAllocation.travelTimeTo}></lightning-input>
                        </div>
                        <div class="slds-p-around_xx-small">
                            <lightning-input type="text" name="travelTimeBack" disabled label="Travel Time Back"
                                value={jobAllocation.travelTimeBack}></lightning-input>
                        </div>
                        <div class="slds-p-around_xx-small">
                            <lightning-input type="text" name="status" disabled label="Status"
                                value={jobAllocation.status}></lightning-input>
                        </div>
                    </div>
                </section>
            </li>
        </ul>
    </template>
</template>
