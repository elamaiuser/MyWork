<template>

    <div class="slds-form-element">
        <label if:true={showLabel} class="slds-form-element__label">{label}</label>
        <c-slwc-click-outside func={closeDropdown}>
            <div class="slds-form-element__control">
                <div class="slds-button-group" style={customStyle.buttonGroup}>
                    <lightning-button-icon onclick={moveBack} icon-name="utility:chevronleft" class="left-arrow slds-m-right_xxx-small" size="medium" variant="border-filled"></lightning-button-icon>
                    <div class="slds-combobox_container" style={customStyle.comboboxContainer}>
                        <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click" role="combobox">
                            <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                                <input type="text" class="slds-input slds-combobox__input slds-combobox__input-value" role="textbox" placeholder="Select a Week" readonly 
                                    value={week} onclick={toggleCalendar}/>
                                <lightning-icon icon-name="utility:event" size="x-small" class="slds-icon_container slds-icon-utility-down slds-input__icon slds-input__icon_right"></lightning-icon>
                            </div>
                            <div class="slds-datepicker slds-dropdown slds-dropdown_right" role="dialog">
                                <div class="slds-datepicker__filter slds-grid">
                                    <div class="slds-datepicker__filter_month slds-grid slds-grid_align-spread slds-grow">
                                        <div class="slds-align-middle">
                                            <button class="slds-button slds-button_icon slds-button_icon-container" title="Previous Month" onclick={previousMonth}>
                                                <lightning-icon icon-name="utility:left" size="x-small" alternative-text="Previous Month"></lightning-icon>
                                            </button>
                                        </div>
                                        <h2 aria-atomic="true" aria-live="assertive" class="slds-align-middle" id="month">
                                            {month} {year}
                                        </h2>
                                        <div class="slds-align-middle">
                                            <button class="slds-button slds-button_icon slds-button_icon-container" title="Next Month" onclick={nextMonth}>
                                                <lightning-icon icon-name="utility:right" size="x-small" alternative-text="Next Month"></lightning-icon>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <table aria-labelledby="month" aria-multiselectable="true" class="slds-datepicker__month" role="grid">
                                    <thead>
                                        <tr id="weekdays">
                                            <template for:each={labels} for:item="label">
                                                <th key={label}>
                                                    <abbr>{label}</abbr>
                                                </th>
                                            </template>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={weeks} for:item="week">
                                            <tr key={week.id} id={week.id} class={week.id}>
                                                <template for:each={week.dates} for:item="date">
                                                    <td aria-selected="false" role="gridcell" 
                                                        key={date.formatted}
                                                        onclick={setSelected}
                                                        data-date={date.formatted}
                                                        class={date.className}>
                                                        <span class="slds-day">{date.text}</span>
                                                    </td>
                                                </template>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                                <button class="slds-button slds-align_absolute-center slds-text-link" onclick={goToday}>
                                    Today
                                </button>
                            </div>
                        </div>
                    </div>
                    <lightning-button-icon onclick={moveNext} icon-name="utility:chevronright" class="right-arrow slds-m-left_xxx-small" size="medium" variant="border-filled"></lightning-button-icon>
                </div>
                
            </div>
        </c-slwc-click-outside>
    </div>
    
</template>
