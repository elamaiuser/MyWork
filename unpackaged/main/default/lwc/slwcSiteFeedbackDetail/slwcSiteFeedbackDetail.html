<template>
    <template if:true={isOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open" style="z-index:10001">
            <lightning-spinner if:true={showSpinner} class="spins" size="medium"></lightning-spinner>
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                        onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small">
                        </lightning-icon>
                    </button>

                    <h2 class="slds-text-heading_medium slds-hyphenate">Role Time Variance Feedback</h2>
                </header>
                <div class="slds-modal__content slds-p-around_small">
                    <c-slwc-page-errors validities={errorMessages}></c-slwc-page-errors>
                    
                    <div class="slds-m-around--xx-small">
                        <div class="slds-grid">
                            <c-slwc-lookup 
                                class="slds-grow"
                                is-readonly
                                is-required
                                object-name="sked__Location__c"
                                icon-name="standard:location" 
                                display-field="name" 
                                label="Site" 
                                name="site" 
                                placeholder="Search Site"
                                selection={model.site}>
                            </c-slwc-lookup>
                        </div>
                    </div>
                    <div class="slds-m-around--xx-small" if:true={isCreatedForRTVChangesFeedback}>
                        <div class="slds-grid">
                            <c-slwc-lookup 
                                class="slds-grow"
                                is-readonly
                                object-name="sked_Role_Time_Variance__c"
                                icon-name="custom:custom8" 
                                display-field="name" 
                                label="Role Time Variance" 
                                name="roleTimeVariance" 
                                selection={model.roleTimeVariance}>
                            </c-slwc-lookup>
                        </div>
                    </div>
                    <div class="slds-m-around--xx-small">
                        <lightning-input 
                            type="date" 
                            name="effectiveStartDate" 
                            label="Effective Start Date" 
                            value={model.effectiveStartDate} 
                            onchange={handleOnChange} 
                            autocomplete="off" 
                            disabled={isReadonly} 
                            required>
                        </lightning-input>
                    </div>
                    <div class="slds-m-around--xx-small">
                        <lightning-input 
                            type="date" 
                            name="effectiveEndDate" 
                            label="Effective End Date" 
                            value={model.effectiveEndDate} 
                            onchange={handleOnChange} 
                            autocomplete="off" 
                            disabled={isReadonly} 
                            required>
                        </lightning-input>
                    </div>
                    <div class="slds-m-around--xx-small">
                        <c-slwc-multi-picklist 
                            name="daysOfWeek" 
                            label="Days Of Week"
                            required
                            disabled={isReadonly} 
                            object-api-name="sked_Site_Feedback__c"
                            field-api-name="sked_Days_Of_Week__c"
                            default-values={model.daysOfWeek}
                            onpicklistchange={handleOnChange}>
                        </c-slwc-multi-picklist>
                    </div>
                    <div class="slds-m-around--xx-small">
                        <template if:false={disableVarianceType}>
                            <c-slwc-picklist name="varianceType" label="Variance Type" unique-key={} required
                                onchange={handleOnChange} object-api-name="sked_Site_Feedback__c"
                                selected-value={model.varianceType} pick-listfield-api-name="sked_Variance_Type__c">
                            </c-slwc-picklist>
                            <template if:true={showVarianceTypeOther}>
                                <lightning-input 
                                    name="varianceTypeOther" 
                                    type="text" 
                                    max-length="100" 
                                    label="Variance Type Other" 
                                    value={model.varianceTypeOther} 
                                    required 
                                    pattern="[a-zA-Z0-9\s]+"
                                    title="Please only input alphanumeric value"
                                    onchange={handleOnChange}>
                                </lightning-input>
                            </template>
                        </template>
                        <template if:true={disableVarianceType}>
                            <div class="slds-m-around--xx-small">
                                <lightning-input type="text" label="Variance Type" read-only value={model.varianceType}></lightning-input>
                            </div>
                            <template if:true={showVarianceTypeOther}>
                                <lightning-input type="text" label="Variance Type Other" read-only value={model.varianceTypeOther}></lightning-input>
                            </template>
                        </template>
                    </div>
                    <div class="slds-m-around--xx-small">
                        <c-slwc-picklist name="bufferType" label="Buffer Type" unique-key={} required
                            disabled={isReadonly} 
                            onchange={handleOnChange} object-api-name="sked_Site_Feedback__c"
                            selected-value={model.bufferType} pick-listfield-api-name="sked_Buffer_Type__c">
                        </c-slwc-picklist>
                    </div>
                    <div class="slds-m-around--xx-small">
                        <c-slwc-multi-picklist name="varianceAppliesTo" 
                            label="Variance Applies To" 
                            required
                            disabled={isReadonly} 
                            object-api-name="sked_Site_Feedback__c"
                            field-api-name="sked_Variance_Applies_To__c"
                            dependent-field-api-name="sked_Variance_Type__c"
                            controlling-field-values={model.varianceTypeControllingFieldValues}
                            default-values={model.varianceAppliesTo}
                            onpicklistchange={handleOnChange}>
                        </c-slwc-multi-picklist>
                    </div>
                    <div class="slds-m-around--xx-small">
                        <c-slwc-multi-picklist name="resourceRoleGroup" 
                            label="Resource Role Group" 
                            required
                            disabled={isReadonly} 
                            object-api-name="sked_Site_Feedback__c"
                            field-api-name="sked_Resource_Role_Group__c"
                            default-values={model.resourceRoleGroup}
                            onpicklistchange={handleOnChange}>
                        </c-slwc-multi-picklist>
                    </div>
                    <div class="slds-m-around--xx-small">
                        <lightning-input type="text" label="Status" read-only value={model.status}></lightning-input>
                    </div>
                    <div class="slds-m-around--xx-small">
                        <lightning-input
                            name="varianceAmount"
                            type="number"
                            min="5"
                            step="5"
                            label="Variation Amount (minutes)"
                            value={model.varianceAmount}
                            required
                            read-only={isReadonly} 
                            onchange={handleOnChange}></lightning-input>
                    </div>
                    <div class="slds-m-around--xx-small">
                        <lightning-textarea onchange={handleOnChange} name="reason"  disabled={isReadonly}  label="Reason" value={model.reason}>
                        </lightning-textarea>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" title="Cancel" onclick={closeModal} class="slds-m-right_xx-small">
                    </lightning-button>
                    <lightning-button class="slds-m-right_xx-small" if:false={isReadonly} onclick={handleSubmit} variant="success" type="submit"
                        name="submit" label="Submit">
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" style="z-index:10000"></div>
    </template>
</template>
