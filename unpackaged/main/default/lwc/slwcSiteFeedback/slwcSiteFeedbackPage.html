<template>
    <div class="slds-grid slds-grid_vertical">
        <lightning-spinner if:true={showSpinner} class="spins" size="medium"></lightning-spinner>
        <div class="slds-align-content-center slds-col width-450">
            <div class="slds-clearfix slds-page-header slds-page-header_record-home fixed-position" style="margin-bottom: var(--lwc-cardSpacingMargin);">
                <div class="slds-page-header__row slds-grid_vertical-align-center">
                    <div class="slds-page-header__col-title">
                        <div class="slds-media">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="standard:form" size="medium"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <div class="slds-page-header__name">
                                    <div class="slds-page-header__name-title">
                                        <h1>
                                            <span class="slds-page-header__title slds-truncate">RTV Feedback</span>
                                        </h1>
                                    </div>
                                </div>
                                <!-- <p class="slds-page-header__name-meta"></p> -->
                            </div>
                        </div>
                    </div>
                    <div class="slds-no-flex">
                        <div class="slds-grid">
                            <div class="slds-no-flex">
                                <ul class="slds-button-group-row">
                                    <li class="slds-button-group-item">
                                        <lightning-button label="Create Feedback" onclick={createSiteFeedback}
                                            class="slds-m-right_xx-small"></lightning-button>
                                        
                                        <lightning-button class="slds-m-top_small" onclick={handleSave} variant="brand" type="submit"
                                            name="update" label="Save"></lightning-button>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="slds-tabs_card slds-scrollable--y height-custom">
                <div if:true={siteFeedbackList.length}>
                    <div for:each={siteFeedbackList} for:item="item" key={item.key} class="item">
                        <div class="slds-border--bottom slds-grid slds-grid--align-spread slds-p-around--xx-small slds-grid_vertical-align-center">
                            <div class="slds-text-heading--small">{item.varianceType}</div>
                            <div>
                                <strong if:true={item.name}>{item.name}</strong>
                                <strong if:false={item.name}>New Record</strong>
                                <lightning-button-icon if:false={item.isReadonly} onclick={handleEditSiteFeedback} data-key={item.key}
                                    class="slds-m-left_xx-small" variant="border-filled" icon-name="action:edit"
                                    alternative-text="Edit" title="Edit"></lightning-button-icon>
                                <lightning-button-icon if:true={item.isReadonly} onclick={handleEditSiteFeedback} data-key={item.key}
                                    class="slds-m-left_xx-small" variant="border-filled" icon-name="action:preview"
                                    alternative-text="View" title="View"></lightning-button-icon>
                                <lightning-button-icon onclick={handleDeleteSiteFeedback} data-id={item.id}
                                    class="slds-m-left_xx-small" variant="border-filled" icon-name="action:delete"
                                    disabled={item.isDeleteDisabled}
                                    alternative-text="Delete" title="Edit"></lightning-button-icon>
                            </div>
                        </div>
                        <div class="slds-grid slds-grid--align-spread slds-p-around--xx-small details">
                            <div class="label">Site</div>
                            <div class="value">
                                <template if:true={item.site}>
                                    <lightning-formatted-url value={item.siteRecordPageUrl} label={item.site.name} target="_blank" ></lightning-formatted-url>
                                </template>
                            </div>
                        </div>
                        <div class="slds-grid slds-grid--align-spread slds-p-around--xx-small details">
                            <div class="label">Drive</div>
                            <div class="value">
                                <template if:true={item.drive}>
                                    <lightning-formatted-url value={item.driveRecordPageUrl} label={item.drive.name} target="_blank" ></lightning-formatted-url>
                                </template>
                            </div>
                        </div>
                        <div class="slds-grid slds-grid--align-spread slds-p-around--xx-small details">
                            <div class="label">Buffer Type</div>
                            <div class="value">{item.bufferType}</div>
                        </div>
                        <div class="slds-grid slds-grid--align-spread slds-p-around--xx-small details">
                            <div class="label">Amount (minutes)</div>
                            <div class="value">{item.amount}</div>
                        </div>
                        <div class="slds-grid slds-grid--align-spread slds-p-around--xx-small details">
                            <div class="label">Status</div>
                            <div class="value">{item.status}</div>
                        </div>
                    </div>
                </div>
                
                <div if:false={siteFeedbackList.length}
                    class="slds-text-align--center slds-m-around--medium slds-text-color_inverse-weak slds-text-heading--small">
                    NO RECORD
                </div>
            </div>
        </div>
    </div>

    <c-slwc-site-feedback-detail
        access-mode={accessMode}
        record={siteFeedbackDetailModalData.record} 
        is-open={siteFeedbackDetailModalData.isOpen}
        onsave={handleSaveSiteModal}
        onclose={handleCloseSiteModal}>
    </c-slwc-site-feedback-detail>
</template>
