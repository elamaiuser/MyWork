<template>
    <template if:true={isOpen}>
        <section role="dialog" tabindex="-1" class={customClass.modal} style="z-index:9999">
            <lightning-spinner if:true={showSpinner} class="spins" size="medium"></lightning-spinner>
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <template if:false={fullScreen}>
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={closeModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                                size="small"></lightning-icon>
                        </button>
                    </template>
                    
                    <h2 if:false={fullScreen} class="slds-text-heading_medium slds-hyphenate">Role Time Variance Feedback</h2>
                    <h3 if:true={site} class={customClass.siteName}>{site.name}</h3>
                </header>
                <div class="slds-modal__content" style="min-height: 24rem;">
                    <lightning-tabset>
                        <lightning-tab label="Feedback">
                            <div if:true={siteFeedbackList.length} class=" slds-p-vertical_xx-small" style="margin-top: -0.75rem; margin-bottom: -0.75rem">
                                <div style="background: #fff;" class="slds-m-around_small"
                                    for:each={siteFeedbackList} for:item="item" key={item.key}>
                                    <div class="slds-border--bottom slds-grid slds-grid--align-spread slds-p-around--xx-small slds-grid_vertical-align-center">
                                        <div class="slds-text-heading--small">{item.varianceType}</div>
                                        <div>
                                            <strong>{item.name}</strong>
                                            <lightning-button-icon if:true={item.isReadonly} onclick={handleViewSiteFeedback} data-key={item.key}
                                                class="slds-m-left_xx-small" variant="border-filled" icon-name="action:preview"
                                                alternative-text="View" title="View"></lightning-button-icon>
                                            <lightning-button-icon if:true={item.isDeletable} onclick={handleDeleteSiteFeedback} data-key={item.key}
                                                class="slds-m-left_xx-small" variant="border-filled" icon-name="action:delete"
                                                alternative-text="Delete" title="Delete"></lightning-button-icon>
                                        </div>
                                    </div>
                                    <div class="slds-grid slds-grid--align-spread slds-p-around--xx-small">
                                        <div>Buffer Type</div>
                                        <div>{item.bufferType}</div>
                                    </div>
                                    <div class="slds-grid slds-grid--align-spread slds-p-around--xx-small">
                                        <div>Amount (minutes)</div>
                                        <div>{item.varianceAmount}</div>
                                    </div>
                                    <div class="slds-grid slds-grid--align-spread slds-p-around--xx-small">
                                        <div>Status</div>
                                        <div>{item.status}</div>
                                    </div>
                                    <div class="slds-grid slds-grid--align-spread slds-p-around--xx-small">
                                        <div>Submitted By</div>
                                        <div>{item.createdByName}</div>
                                    </div>
                                </div>
                            </div>
                            
                            <div if:false={siteFeedbackList.length}
                                class="slds-text-align--center slds-m-around--medium slds-text-color_inverse-weak slds-text-heading--small">
                                NO RECORD
                            </div>
                        </lightning-tab>
                        <lightning-tab label="Role Time Variance">
                            <div if:true={roleTimeVarianceList.length} class=" slds-p-vertical_xx-small" style="margin-top: -0.75rem; margin-bottom: -0.75rem">
                                <div style="background: #fff;" class="slds-m-around_small"
                                    for:each={roleTimeVarianceList} for:item="item" key={item.key}>
                                    <div class="slds-border--bottom slds-grid slds-grid--align-spread slds-p-around--xx-small slds-grid_vertical-align-center">
                                        <div class="slds-text-heading--small">{item.varianceType}</div>
                                        <div>
                                            <strong>{item.name}</strong>
                                        </div>
                                    </div>
                                    <div class="slds-grid slds-grid--align-spread slds-p-around--xx-small">
                                        <div>Buffer Type</div>
                                        <div>{item.bufferType}</div>
                                    </div>
                                    <div class="slds-grid slds-grid--align-spread slds-p-around--xx-small">
                                        <div>Amount (minutes)</div>
                                        <div>{item.varianceAmount}</div>
                                    </div>
                                    <div class="slds-grid slds-grid--align-spread slds-p-around--xx-small">
                                        <div>Resource Role Group</div>
                                        <div>{item.resourceRoleGroup}</div>
                                    </div>
                                    <div class="slds-grid slds-grid--align-spread slds-p-around--xx-small">
                                        <div>Variance Applies to</div>
                                        <div>{item.varianceAppliesTo}</div>
                                    </div>
                                    <div class="slds-grid slds-grid--align-spread slds-p-around--xx-small">
                                        <div>Effective Start Date</div>
                                        <div>
                                            <lightning-formatted-date-time value={item.effectiveStartDate} year="numeric" month="numeric" day="numeric" time-zone='GMT'></lightning-formatted-date-time>
                                        </div>
                                    </div>
                                    <div class="slds-grid slds-grid--align-spread slds-p-around--xx-small">
                                        <div>Effective End Date</div>
                                        <div>
                                            <lightning-formatted-date-time value={item.effectiveEndDate} year="numeric" month="numeric" day="numeric" time-zone='GMT'></lightning-formatted-date-time>
                                        </div>
                                    </div>
                                    <div class="slds-grid slds-grid--align-spread slds-p-around--xx-small">
                                        <div>Days Of Week</div>
                                        <div>{item.daysOfWeek}</div>
                                    </div>
                                    <div class="slds-grid slds-grid_align-end slds-p-around--xx-small">
                                        <lightning-button variant="neutral" icon-name="utility:form" label="Edit Existing RTV" class="slds-m-left_x-small" onclick={handleCreateFeedbackRTVChanges} data-key={item.key}></lightning-button>
                                    </div>
                                </div>
                            </div>
                            <div if:false={roleTimeVarianceList.length}
                                class="slds-text-align--center slds-m-around--medium slds-text-color_inverse-weak slds-text-heading--small">
                                NO RECORD
                            </div>
                        </lightning-tab>
                    </lightning-tabset>
                </div>
                <footer class="slds-modal__footer slds-grid slds-grid--align-spread">
                    <lightning-button label="Submit New Feedback" onclick={createSiteFeedback}
                        class="slds-m-right_xx-small" icon-name="utility:form"></lightning-button>
                    <div>
                        <lightning-button if:false={fullScreen} label="Close" title="Close" onclick={closeModal}
                            class="slds-m-right_xx-small">
                        </lightning-button>
                    </div>
                </footer>
            </div>
        </section>
        <c-slwc-site-feedback-detail
            record={siteFeedbackDetailModalData.siteFeedbackRecord}
            role-time-variance-record={siteFeedbackDetailModalData.roleTimeVarianceRecord}
            site={site} 
            job={job}
            is-open={siteFeedbackDetailModalData.isOpen}
            onsubmitted={handleSiteFeedbackSubmitted}
            onclose={handleCloseSiteModal}
            access-mode={accessMode}>
        </c-slwc-site-feedback-detail>
        <c-slwc-confirm-modal
            if:true={confirmModalData.isOpen}
            is-open={confirmModalData.isOpen}
            title={confirmModalData.title}
            message={confirmModalData.message}
            handle-on-close={confirmModalData.onClose}
            confirm-btn-label={confirmModalData.confirmBtnLabel}
            cancel-btn-label={confirmModalData.cancelBtnLabel}
            size='x-small'
            layer-index="999">
        </c-slwc-confirm-modal>
        <div class="slds-backdrop slds-backdrop_open" style="z-index:9998"></div>
    </template>
</template>
