<template>
    <template if:true={isOpen}>
        <section role="dialog" if:true={isOpen} tabindex="-1" class="slds-modal slds-fade-in-open" style="z-index:10001">
            <lightning-spinner if:true={showSpinner} class="spins" size="medium"></lightning-spinner>
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                        onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small">
                        </lightning-icon>
                    </button>

                    <h2 class="slds-text-heading_medium slds-hyphenate" if:false={isReadonly}>Edit Operation Record Staff</h2>
                    <h2 class="slds-text-heading_medium slds-hyphenate" if:true={isReadonly}>View Operation Record Staff</h2>
                </header>
                <div class="slds-modal__content slds-p-around_small">
                    <c-slwc-page-errors validities={errorMessages}></c-slwc-page-errors>

                    <div
                        class="slds-m-horizontal--x-small slds-m-vertical--small slds-grid slds-grid_vertical-align-center slds-grid--align-spread">
                        <label class="slds-form-element__label">Absent</label>
                        <lightning-input variant="label-hidden" type="toggle" disabled={isReadonly} onchange={handleChange} name="absent"
                            label="Absent" checked={model.absent}>
                        </lightning-input>
                    </div>
                    <div class="slds-p-around_x-small">
                        <lightning-input type="text" max-length="255" disabled label="Operation Staff Record Name"
                            value={model.name}>
                        </lightning-input>
                    </div>
                    <div class="slds-p-around_x-small">
                        <lightning-input type="text" max-length="255" disabled label="Operation Name"
                            value={model.operationRecordName}>
                        </lightning-input>
                    </div>
                    <div class="slds-p-around_x-small">
                        <lightning-input type="text" max-length="255" disabled label="Resource" value={model.resourceName}>
                        </lightning-input>
                    </div>
                    <div class="slds-p-around_x-small">
                        <lightning-input type="text" max-length="255" disabled label="eBDR ID" value={model.eBdrId}>
                        </lightning-input>
                    </div>
                    <div class="slds-p-around_x-small" if:true={model.role}>
                        <lightning-input type="text" max-length="255" disabled label="Role" value={model.role}>
                        </lightning-input>
                    </div>
                    <div class="slds-p-around_x-small" if:true={model.dualRole}>
                        <lightning-input type="text" max-length="255" disabled label="Role" value={model.dualRole}>
                        </lightning-input>
                    </div>
                    <div class="slds-p-around_x-small">
                        <lightning-input if:true={isAbsent} disabled type="text" onchange={handleChange}
                            name="actualRoles" label="Actual Role(s)"
                            value={model.actualRoles}>
                        </lightning-input>
                        <c-slwc-multi-picklist if:false={isAbsent}
                            disabled={disabled} name="actualRoles" label="Actual Role(s)"
                            object-api-name="sked_Operation_Record_Staff__c" field-api-name='sked_Actual_Roles__c'
                            onpicklistchange={handleChange} default-values={model.actualRoles}>
                        </c-slwc-multi-picklist>
                    </div>
                    <div class="slds-p-around_x-small slds-clearfix slds-float_left">
                        <div class="slds-grid slds-wrap">
                            <div class="slds-col slds-medium-size_6-of-12 slds-size_1-of-1">
                                <lightning-input 
                                    type="date" 
                                    name="scheduledShiftStartDate" 
                                    label="Scheduled Shift Start Date" 
                                    value={model.scheduledShiftStartDate} 
                                    onchange={handleChange}
                                    autocomplete="off"
                                    required={isSubmit}
                                    disabled={disableScheduledShiftStartEnd}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-medium-size_6-of-12 slds-size_1-of-1 slds-p-left_x-small">
                                <c-slwc-time-input-with-timezone 
                                    input-date={model.scheduledShiftStartDate}
                                    timezone={model.timezoneSidId}>
                                    <lightning-input 
                                        slot="input"
                                        type="time" name="scheduledShiftStartTime" 
                                        label="Scheduled Shift Start Time" value={model.scheduledShiftStartTime} 
                                        onchange={handleChange}
                                        required={isSubmit}
                                        disabled={disableScheduledShiftStartEnd}>
                                    </lightning-input>
                                </c-slwc-time-input-with-timezone>
                            </div>
                        </div>
                    </div>
                    <div class="slds-p-around_x-small slds-clearfix slds-float_left">
                        <div class="slds-grid slds-wrap">
                            <div class="slds-col slds-medium-size_6-of-12 slds-size_1-of-1">
                                <lightning-input 
                                    type="date" 
                                    name="scheduledShiftEndDate" 
                                    label="Scheduled Shift End Date" 
                                    value={model.scheduledShiftEndDate} 
                                    onchange={handleChange} 
                                    autocomplete="off" 
                                    required={isSubmit}
                                    disabled={disableScheduledShiftStartEnd}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-medium-size_6-of-12 slds-size_1-of-1 slds-p-left_x-small">
                                <c-slwc-time-input-with-timezone 
                                    input-date={model.scheduledShiftEndDate}
                                    timezone={model.timezoneSidId}>
                                    <lightning-input 
                                        slot="input"
                                        type="time" name="scheduledShiftEndTime" 
                                        label="Scheduled Shift End Time" value={model.scheduledShiftEndTime} 
                                        onchange={handleChange}
                                        required={isSubmit}
                                        disabled={disableScheduledShiftStartEnd}>
                                    </lightning-input>
                                </c-slwc-time-input-with-timezone>
                            </div>
                        </div>
                    </div>
                    <div class="slds-p-around_x-small slds-clearfix slds-float_left">
                        <div class="slds-grid slds-wrap">
                            <div class="slds-col slds-medium-size_6-of-12 slds-size_1-of-1">
                                <lightning-input 
                                    type="date" 
                                    name="actualShiftStartDate" 
                                    label="Actual Shift Start Date" 
                                    value={model.actualShiftStartDate} 
                                    onchange={handleChange} 
                                    autocomplete="off" 
                                    required={isSubmit}
                                    disabled={disabled}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-medium-size_6-of-12 slds-size_1-of-1 slds-p-left_x-small">
                                <c-slwc-time-input-with-timezone 
                                    input-date={model.actualShiftStartDate}
                                    timezone={model.timezoneSidId}>
                                    <lightning-input 
                                        slot="input"
                                        type="time" name="actualShiftStartTime" 
                                        label="Actual Shift Start Time" value={model.actualShiftStartTime} 
                                        onchange={handleChange}
                                        required={isSubmit}
                                        disabled={disabled}>
                                    </lightning-input>
                                </c-slwc-time-input-with-timezone>
                            </div>
                        </div>
                    </div>
                    <div class="slds-p-around_x-small slds-clearfix slds-float_left">
                        <div class="slds-grid slds-wrap">
                            <div class="slds-col slds-medium-size_6-of-12 slds-size_1-of-1">
                                <lightning-input 
                                    type="date" 
                                    name="actualShiftEndDate" 
                                    label="Actual Shift End Date" 
                                    value={model.actualShiftEndDate} 
                                    onchange={handleChange} 
                                    autocomplete="off" 
                                    required={isSubmit}
                                    disabled={disabled}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-medium-size_6-of-12 slds-size_1-of-1 slds-p-left_x-small">
                                <c-slwc-time-input-with-timezone 
                                    input-date={model.actualShiftEndDate}
                                    timezone={model.timezoneSidId}>
                                    <lightning-input 
                                        slot="input"
                                        type="time" name="actualShiftEndTime" 
                                        label="Actual Shift End Time" value={model.actualShiftEndTime} 
                                        onchange={handleChange}
                                        required={isSubmit}
                                        disabled={disabled}>
                                    </lightning-input>
                                </c-slwc-time-input-with-timezone>
                            </div>
                        </div>
                    </div>
                    <div class="slds-p-around_x-small slds-clearfix" style="clear: both">
                        <lightning-input if:true={isAbsent} disabled type="text" onchange={handleChange}
                            name="lateArrivalReasons" label="Late Arrival Reasons"
                            value={model.lateArrivalReasons}>
                        </lightning-input>
                        <c-slwc-picklist if:false={isAbsent} name="lateArrivalReasons"
                            disabled={disabled}
                            label="Late Arrival Reasons" unique-key={} onchange={handleChange}
                            object-api-name="sked_Operation_Record_Staff__c"
                            selected-value={model.lateArrivalReasons}
                            required={isLate}
                            pick-listfield-api-name="sked_Late_Arrival_Reasons__c">
                        </c-slwc-picklist>
                    </div>
                    <div class="slds-p-around_x-small slds-clearfix slds-float_left" if:true={requiresLateArrivalDateTime}>
                        <div class="slds-form-element__label slds-no-flex" title="Date/Time Late Arrival Received"><abbr class="slds-required" title="required">* </abbr>Date/Time Late Arrival Received</div>
                        <c-slwc-time-input-with-timezone 
                            no-label
                            input-date={model.lateArrivalDateTimeReceived}
                            timezone={model.timezoneSidId}>
                            <lightning-input 
                                slot="input"
                                variant="label-hidden"
                                type="datetime" label="Date/Time Late Arrival Received"
                                name="lateArrivalDateTimeReceived"
                                timezone={model.timezoneSidId}
                                onchange={handleChange}
                                required={isLate}
                                disabled={disabled}
                                value={model.lateArrivalDateTimeReceived}>
                            </lightning-input>
                        </c-slwc-time-input-with-timezone>
                    </div>
                    <div class="slds-p-around_x-small slds-clearfix" style="clear: both">
                        <lightning-input if:true={isAbsent} disabled type="text" onchange={handleChange}
                            name="earlyDepartureReasons" label="Early Departure Reasons"
                            value={model.earlyDepartureReasons}>
                        </lightning-input>
                        <c-slwc-picklist if:false={isAbsent} name="earlyDepartureReasons"
                            disabled={disabled}
                            label="Early Departure Reasons" unique-key={} onchange={handleChange}
                            object-api-name="sked_Operation_Record_Staff__c"
                            selected-value={model.earlyDepartureReasons}
                            required={isEarly}
                            pick-listfield-api-name="sked_Early_Departure_Reasons__c">
                        </c-slwc-picklist>
                    </div>
                    <div class="slds-p-around_x-small slds-clearfix slds-float_left" if:true={requiresEarlyDepartureDateTime}>
                        <div class="slds-form-element__label slds-no-flex" title="Date/Time Early Departure Received"><abbr class="slds-required" title="required">* </abbr>Date/Time Early Departure Received</div>
                        <c-slwc-time-input-with-timezone 
                            no-label
                            input-date={model.earlyDepartureDateTimeReceived}
                            timezone={model.timezoneSidId}>
                            <lightning-input 
                                slot="input"
                                variant="label-hidden"
                                name="earlyDepartureDateTimeReceived"
                                type="datetime" label="Date/Time Early Departure Received"
                                timezone={model.timezoneSidId}
                                onchange={handleChange}
                                required={isEarly}
                                disabled={disabled}
                                value={model.earlyDepartureDateTimeReceived}>
                            </lightning-input>
                        </c-slwc-time-input-with-timezone>
                    </div>
                    <div style="clear: both;"
                        class="slds-m-horizontal--x-small slds-m-vertical--small slds-grid slds-grid_vertical-align-center slds-grid--align-spread">
                        <label class="slds-form-element__label">No Meal</label>
                        <lightning-input onchange={handleChange} disabled={disabled} name="noMeal" variant="label-hidden"
                            type="toggle" label="No Meal" checked={model.noMeal}>
                        </lightning-input>
                    </div>
                    <div
                        class="slds-m-horizontal--x-small slds-m-vertical--small slds-grid slds-grid_vertical-align-center slds-grid--align-spread">
                        <label class="slds-form-element__label">Add Meal Breaks Taken</label>
                        <lightning-input onchange={handleChange} disabled={disabledConfigVariable.addMealBreaksTaken} name="addMealBreaksTaken" variant="label-hidden"
                            type="toggle" label="Add Meal Breaks Taken" checked={model.addMealBreaksTaken}>
                        </lightning-input>
                    </div>
                    <div if:true={model.addMealBreaksTaken}>
                        <div class="slds-m-horizontal--x-small slds-m-vertical--small slds-grid slds-grid_vertical-align-center slds-grid--align-spread">
                            <label class="slds-form-element__label">
                                <template if:false={disabled}>
                                    <abbr class="slds-required" title="required">* </abbr>
                                </template>Meal Breaks</label>
                            <lightning-input onchange={handleChange} name="noOfMealBreaksTaken" value={model.noOfMealBreaksTaken}  
                                type="number" disabled={disabled}>
                            </lightning-input>
                            <label class="slds-form-element__label">Enter Meal Break Times</label>
                            <lightning-input onchange={handleChange} disabled={disabledConfigVariable.enterMealBreakTimes} name="enterMealBreakTimes" variant="label-hidden"
                                type="toggle" label="Enter Meal Break Times" checked={model.enterMealBreakTimes}>
                            </lightning-input>      
                        </div>
                        <div if:true={customErrorModel.showMealBreakError} class="slds-text-color_error slds-p-left_medium">Meal Break must be populated</div>
                        <div if:true={model.enterMealBreakTimes}>
                            <template for:each={mealOrRestBreakTimes.mealBreakTimings} for:item="input" for:index="index">
                                <div key={input.id} class="slds-grid slds-form-element slds-p-top_medium">
                                    <label class="slds-form-element__label slds-p-left_x-small">{input.name}</label>
                                    <div class="slds-col slds-p-horizontal_medium">                                        
                                        <lightning-input 
                                            slot="input" 
                                            variant="label-hidden" 
                                            type="time" 
                                            label={input.name}
                                            onchange={handleMealAndRestBreakTimeChange} 
                                            data-index={index} 
                                            data-field="mealStartTime"
                                            name="startTime" 
                                            required={model.enterMealBreakTimes}
                                            value={input.startTime}
                                            disabled={disabled}>              
                                        </lightning-input>
                                    </div>                                       
                                    <div class="slds-col slds-p-horizontal_medium">                                          
                                        <lightning-input 
                                            slot="input" 
                                            variant="label-hidden" 
                                            type="time" 
                                            label={input.Name}
                                            onchange={handleMealAndRestBreakTimeChange}
                                            data-index={index} 
                                            data-field="mealEndTime" 
                                            name="endTime" 
                                            required={model.enterMealBreakTimes}
                                            value={input.endTime}
                                            disabled={disabled}>
                                        </lightning-input>
                                    </div>
                                </div>                               
                            </template>
                        </div>                    
                    </div>
                    <div
                        class="slds-m-horizontal--x-small slds-m-vertical--small slds-grid slds-grid_vertical-align-center slds-grid--align-spread">
                        <label class="slds-form-element__label">Add Rest Breaks Taken</label>
                        <lightning-input onchange={handleChange} disabled={disabledConfigVariable.addRestBreaksTaken} name="addRestBreaksTaken" variant="label-hidden"
                            type="toggle" label="Add rest breaks taken" checked={model.addRestBreaksTaken}>
                        </lightning-input>
                    </div>
                    <div if:true={model.addRestBreaksTaken}>
                        <div class="slds-m-horizontal--x-small slds-m-vertical--small slds-grid slds-grid_vertical-align-center slds-grid--align-spread">
                        <label class="slds-form-element__label">
                            <template if:false={disabled}>
                                <abbr class="slds-required" title="required">* </abbr>
                            </template>Rest Breaks</label>
                        <lightning-input onchange={handleChange} name="noOfRestBreaksTaken" value={model.noOfRestBreaksTaken} 
                            type="number" disabled={disabled}>
                        </lightning-input>  
                        <label class="slds-form-element__label">Enter Rest Break Times</label>
                        <lightning-input onchange={handleChange} disabled={disabledConfigVariable.enterRestBreakTimes} name="enterRestBreakTimes" variant="label-hidden"
                            type="toggle" label="Enter Rest Break Times" checked={model.enterRestBreakTimes}>
                        </lightning-input>
                        </div>
                        <div if:true={customErrorModel.showRestBreakError} class="slds-text-color_error slds-p-left_medium">Rest Break must be populated</div>
                        <div if:true={model.enterRestBreakTimes}>
                            <template for:each={mealOrRestBreakTimes.restBreakTimings} for:item="input" for:index="index">
                                <div key={input.id} class="slds-grid slds-form-element slds-p-top_medium">
                                    <label class="slds-form-element__label slds-p-left_x-small">{input.name}</label>
                                    <div class="slds-col slds-p-horizontal_medium">                                        
                                        <lightning-input 
                                            slot="input" 
                                            variant="label-hidden" 
                                            type="time" 
                                            label={input.name}
                                            timezone={model.timezoneSidId} 
                                            data-index={index} 
                                            data-field="restStartTime"
                                            onchange={handleMealAndRestBreakTimeChange} 
                                            name="startTime" 
                                            required={model.enterRestBreakTimes}
                                            value={input.startTime}
                                            disabled={disabled}>              
                                        </lightning-input>
                                    </div>                                       
                                    <div class="slds-col slds-p-horizontal_medium">                                          
                                        <lightning-input 
                                            slot="input" 
                                            variant="label-hidden" 
                                            type="time" 
                                            label={input.Name}
                                            timezone={model.timezoneSidId} 
                                            data-index={index} 
                                            data-field="restEndTime"
                                            onchange={handleMealAndRestBreakTimeChange} 
                                            name="endTime" 
                                            required={model.enterRestBreakTimes}
                                            value={input.endTime}
                                            disabled={disabled}>
                                        </lightning-input>
                                    </div>
                                </div>                               
                            </template>
                        </div>                       
                    </div>
                    <div if:true={isAbsent} class="slds-m-horizontal--x-small slds-m-vertical--small slds-grid slds-grid_vertical-align-center slds-grid--align-spread">
                        <label class="slds-form-element__label">Premiums/Op Pay</label>
                        <lightning-input onchange={handleChange} disabled={disabled} name="premiumsOpPay"
                            variant="label-hidden" type="toggle" label="Premiums/Op Pay">
                        </lightning-input>
                    </div>
                    <div if:false={isAbsent} class="slds-p-around_x-small">
                        <c-slwc-multi-picklist  
                            disabled={disabled} name="premiumsOpPay" label="Premiums/Op Pay"
                            object-api-name="sked_Operation_Record_Staff__c" field-api-name='sked_Premiums_Op_Pay__c'
                            onpicklistchange={handleChange} default-values={model.premiumsOpPay}>
                        </c-slwc-multi-picklist>
                    </div>
                    <div class="slds-p-around_x-small">
                        <lightning-textarea onchange={handleChange} name="notesComments" label="Notes/Comments"
                            value={model.notesComments}></lightning-textarea>
                    </div>
                    <div
                        class="slds-m-horizontal--x-small slds-m-vertical--small slds-grid slds-grid_vertical-align-center slds-grid--align-spread">
                        <label class="slds-form-element__label">Pool</label>
                        <lightning-input onchange={handleChange} disabled={disabled} name="pool" variant="label-hidden"
                            type="toggle" label="Pool" checked={model.pool}>
                        </lightning-input>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" title="Cancel" onclick={closeModal} class="slds-m-right_xx-small">
                    </lightning-button>
                    <lightning-button class="slds-m-top_small" if:false={isReadonly} onclick={handleSave} variant="brand" type="submit"
                        name="update" label="Save"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" style="z-index:10000"></div>
        <c-slwc-confirm-modal
            is-open={warningModalData.isOpen}
            title={warningModalData.title}
            message={warningModalData.message}
            handle-on-close={warningModalData.onClose}
            confirm-btn-label={warningModalData.confirmBtnLabel}
            cancel-btn-label={warningModalData.cancelBtnLabel}
            layer-index="10002"
            size='x-small'>
        </c-slwc-confirm-modal>                             
    </template>
</template>
