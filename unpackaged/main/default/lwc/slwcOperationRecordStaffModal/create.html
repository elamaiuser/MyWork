<template>
    <template if:true={isOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open" style="z-index:10001">
            <lightning-spinner if:true={showSpinner} class="spins" size="medium"></lightning-spinner>
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                        onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small">
                        </lightning-icon>
                    </button>

                    <h2 class="slds-text-heading_medium slds-hyphenate">Create Operation Record Staff</h2>
                </header>
                <div class="slds-modal__content slds-p-around_small" style="overflow: initial;">
                    <div class="slds-p-around_x-small">
                        <c-slwc-custom-datatable 
                            key-field="id"
                            data={roleTableData}
                            columns={COLUMNS}
                            wrap-text-max-lines="3"
                            hide-checkbox-column>
                        </c-slwc-custom-datatable>
                    </div>
                    <div class="slds-p-around_x-small">
                        <div>
                            <c-slwc-multi-picklist
                                name="actualRoles" label="Actual Role(s)"
                                required
                                object-api-name="sked_Operation_Record_Staff__c" field-api-name='sked_Actual_Roles__c'
                                onpicklistchange={handleSelectActualRoles} default-values={filter.actualRoles}>
                            </c-slwc-multi-picklist>
                        </div>
                       
                        <div class="slds-m-top_x-small">
                            <c-slwc-lookup icon-name="standard:people"
                                is-required
                                is-readonly={resourceLookupDisabled}
                                selection={filter.resource}
                                onselectionchange={handleSelectResource} 
                                display-field="name" 
                                label="Resource" 
                                name="resource"
                                value={filter.queryText} 
                                is-custom-search 
                                custom-search-func={handleSearchResources}
                                placeholder="Search Resource">
                            </c-slwc-lookup>
                        </div>
                    </div>

                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" title="Cancel" onclick={closeModal} class="slds-m-right_xx-small">
                    </lightning-button>
                    <lightning-button class="slds-m-top_small" disabled={disableSave} onclick={handleCreate} variant="brand"
                        type="submit" name="update" label="Save"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" style="z-index:10000"></div>
    </template>
</template>
