<template>
    <template if:true={hasError}>
        <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
            <span class="slds-assistive-text">error</span>
            <span class="slds-icon_container slds-icon-utility-error slds-m-right_x-small">
              <svg class="slds-icon slds-icon_x-small" aria-hidden="true">
                <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#error"></use>
              </svg>
            </span>
            <h2>{errorMessageToDisplay}</h2>
          </div>
    </template>
    <lightning-card>
        <div class="slds-p-horizontal_medium" style="font-size: 16px;"><b>Weekly Staffing Role Time Report</b></div>
        <c-bsf-staffing-report-search-panel 
            onselectevent={handleSelectedValues} 
            onresetevent={handleResetValues} 
            prepopulatevalues={prepopulatevalues}
            selecteddivision={selecteddivision}
            selectedregion={selectedregion}
            selecteddistict={selecteddistict}
            selectedcollopp={selectedcollopp}
            selectedstartdate={selectedstartdate}
            selectedenddate={selectedenddate}
            selecteddrivetype={selecteddrivetype}
            selecteddrivedispatched={selecteddrivedispatched}
            frommobile={frommobile}
            enabledrivetype={enablelastrow}>
        </c-bsf-staffing-report-search-panel>
        <div class="slds-grid slds-gutters slds-p-horizontal_medium slds-p-top_medium">
            <lightning-button icon-name="utility:search" variant="brand" label="Search Report" title="Search" name="search" onclick={handleSearch} class="slds-m-left_x-small"></lightning-button>
            <lightning-button icon-name="utility:preview" variant="brand" label="View PDF" title="View PDF" name="viewpdf" disabled={disablePdfButton} onclick={handleViewPdf} class="slds-m-left_x-small"></lightning-button>
            <lightning-button icon-name="utility:download" variant="brand" label="Download PDF" title="Export to PDF" name="exporttopdf" disabled={disablePdfButton} onclick={exportToPdf} class="slds-m-left_x-small"></lightning-button>
        </div>
    </lightning-card>
    <template if:true={showPopup}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleClosePopupHandler}>
                    <lightning-icon icon-name="utility:close"
                    alternative-text="close"
                    variant="inverse"
                    size="small" ></lightning-icon>
                <span class="slds-assistive-text">Close</span>
            </button>
            <div class="slds-modal__content slds-p-around_medium slds-modal__content_headless" id="modal-content-id-1">
                <iframe id="LWCWithVFPage" src={getPopUpRedirectUrl} width="100%" height="600" frameborder="0"> </iframe>
            </div>
            <div class="slds-modal__footer">
                <lightning-button icon-name="utility:download" variant="brand" label="Download" title="Download" name="download" onclick={exportToPdf} class="slds-m-left_x-small"></lightning-button>
            </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
    <template if:true={loaded}>
        <lightning-spinner alternative-text="Loading"></lightning-spinner>
    </template>
    <template  if:true={hasRecords}>
        <div class="slds-text-body_small"><p align="right">* Staff Arrival Time includes lunch prior to draw start</p></div>
    </template>
    <template  if:true={hasRecords}>
       <table class="slds-table slds-table_cell-buffer slds-table_bordered" aria-label="Search Data" border="n" style="border-collapse: collapse;">
            <thead>
                <tr class="slds-line-height_reset">
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Event Date">Event Date</div>
                    </th>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Event Name">Event Name</div>
                    </th>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Details">Details</div>
                    </th>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Vehicles">Vehicles</div>
                    </th>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Resource Name ID">Resource Name ID</div>
                    </th>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Resource Role">Resource Role</div>
                    </th>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Staff Arrival Time">Staff Arrival Time</div>
                    </th>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Shift Start">Shift Start</div>
                    </th>
                    <th class="" scope="col">
                        <div class="slds-truncate" title="Shift End">Shift End</div>
                    </th>
                </tr>
            </thead>
            <tbody>
                <template if:true={dataArry}>
                    <template for:each={dataArry} for:item="data">
                        <tr key={data.eventDate} class="slds-hint-parent">
                            <td data-label="data" rowspan={data.rowspan} style="vertical-align: top;">
                                <div class="slds-truncate">{data.eventDate}</div>
                            </td>
                        </tr>
                        <template for:each={data.eventDetails} for:item="evDetails">
                            <tr key={evDetails.eventName} class="slds-hint-parent">
                                <td class="slds-cell-wrap" data-label="data" rowspan={evDetails.rowspan} style="vertical-align: top;max-width: 20%;">
                                    <div class="slds-line-clamp_large">{evDetails.eventName}</div>
                                </td>
                                <td class="slds-cell-wrap" data-label="data" rowspan={evDetails.rowspan} style="vertical-align: top;max-width: 20%;">
                                    <template lwc:if={evDetails.isDrive}>
                                        <div class="slds-line-clamp_large"><b>Proj Proc:</b>&nbsp;{evDetails.projProc}</div><br />
                                        <div class="slds-line-clamp_large"><b>Assigned Machine Count:</b>&nbsp;{evDetails.assignedMachineCount}</div><br />
                                        <div class="slds-line-clamp_large"><b>Staff Req:</b>&nbsp;{evDetails.staffReq}</div><br />
                                    </template>
                                    <div class="slds-line-clamp_large"><b>Hours:</b>&nbsp;{evDetails.hours}</div>
                                </td>
                                <td class="slds-cell-wrap" data-label="data" rowspan={evDetails.rowspan} style="vertical-align: top;max-width: 20%;">
                                    <div class="slds-line-clamp_large"><b>Vehicles:</b>&nbsp;{evDetails.eventVehicles}</div><br />
                                    <div class="slds-line-clamp_large"><b>Auto Machines:</b>&nbsp;{evDetails.autoMachines}</div>
                                </td>
                             </tr>
                             <template for:each={evDetails.resources} for:item="reso">
                                <tr key={reso.resourceName} class="slds-hint-parent">
                                    <td class="slds-cell-wrap" data-label="data" style="vertical-align: top;">
                                        <div class="slds-line-clamp_large">{reso.resourceName}</div>
                                    </td>
                                    <td class="slds-cell-wrap" data-label="data"  style="vertical-align: top;">
                                        <div class="slds-line-clamp_large">{reso.resourceRole}</div>
                                    </td>
                                    <td data-label="data" style="vertical-align: top;">
                                        <div class="slds-truncate">{reso.staffArrivalTime}</div>
                                    </td>
                                    <td data-label="data" style="vertical-align: top;">
                                        <div class="slds-truncate">{reso.shiftStart}</div>
                                    </td>
                                    <td data-label="data" style="vertical-align: top;">
                                        <div class="slds-truncate">{reso.shiftEnd}</div>
                                    </td>
                                 </tr>
                            </template>
                        </template>
                    </template>
                </template>
            </tbody>
        </table>
    </template>
</template>
