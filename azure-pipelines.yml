# Runs as a required check on Pull Requests.
pr:
- BSFReleaseQA_SFCA

# Disables the pipeline from running on direct pushes.
trigger: none

pool:
  vmImage: ubuntu-latest

steps:
# Step 1: Checkout with full history and credentials for Git commands.
- checkout: self
  persistCredentials: true
  fetchDepth: 0

# Step 2: Install Node.js.
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

# Step 3: Install project dependencies (for ESLint) from package.json.
- script: npm install
  displayName: 'Install NPM Dependencies'

# Step 4: Install Salesforce CLI & the Code Analyzer plugin.
- script: |
    npm install @salesforce/cli --global
    echo y | sf plugins install @salesforce/sfdx-scanner
  displayName: 'Install Salesforce CLI & Scanner'

# Step 5: Run the scanner on changed files.
- script: |
    # This explicit fetch command creates the specific local ref that the diff command needs.
    echo "Fetching target branch $(System.PullRequest.TargetBranch) for comparison..."
    git fetch origin $(System.PullRequest.TargetBranch):refs/remotes/origin/$(System.PullRequest.TargetBranch)

    echo "Identifying changed Salesforce files in this Pull Request..."
    FILES_TO_SCAN=$(git diff --name-only "origin/$(System.PullRequest.TargetBranch)...HEAD" | grep -E "\.(cls|trigger|component|page|js|xml)$" | tr '\n' ',' | sed 's/,$//')

    if [ -z "$FILES_TO_SCAN" ]; then
      echo "No relevant Salesforce files were changed. Skipping scan."
      exit 0
    fi

    echo "The following files will be scanned: $FILES_TO_SCAN"

    # This is the corrected command, with the --pmdconfig line removed.
    # The PMD engine will now use its default rules.
    sf scanner:run \
      --target "$FILES_TO_SCAN" \
      --engine "pmd,eslint" \
      --format "table" \
      --eslintconfig ".eslintrc.json" \
      --severity-threshold "2"
  displayName: 'Run Salesforce Code Analyzer on Changed Files'